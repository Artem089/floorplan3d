/* ======================= 操作 ======================= */
function select(sel){ ui.sel = sel; renderBg(); renderSel(); renderPanel(); }
function rotateSel(d){ if (ui.sel?.kind==='furn') mutate(() => { const f = getF(ui.sel.id); f.rot = norm(f.rot + d); }); }
/* Масштабирование всего плана вокруг начала координат ( мм → мм * k ).
 * Используется «площадь по чертежу»: k = sqrt(целевая / текущая).
 * Фон НЕ масштабируется (он привязан калибровкой к реальности). */
function scalePlan(k){
  const P = v => Math.round(v*k);
  state.walls.forEach(w => { w.x0 = P(w.x0); w.y0 = P(w.y0); w.x1 = P(w.x1); w.y1 = P(w.y1); });
  state.wins.forEach(w => { w.x0 = P(w.x0); w.y0 = P(w.y0); w.x1 = P(w.x1); w.y1 = P(w.y1); });
  (state.lines || []).forEach(l => { l.x0 = P(l.x0); l.y0 = P(l.y0); l.x1 = P(l.x1); l.y1 = P(l.y1); });
  state.doors.forEach(d => {
    if (Array.isArray(d.a)){ d.a[0] = P(d.a[0]); d.a[1] = P(d.a[1]); }
    if (Array.isArray(d.b)){ d.b[0] = P(d.b[0]); d.b[1] = P(d.b[1]); }
    if (Array.isArray(d.h)){ d.h[0] = P(d.h[0]); d.h[1] = P(d.h[1]); }
    if (d.len) d.len = Math.max(50, Math.round(d.len*k));
  });
  state.furniture.forEach(f => { f.cx = P(f.cx); f.cy = P(f.cy); f.w = Math.max(50, Math.round(f.w*k)); f.d = Math.max(50, Math.round(f.d*k)); });
  (state.lamps || []).forEach(l => { l.x = P(l.x); l.y = P(l.y); });
  state.measures.forEach(m => {
    if (m.a && 'x' in m.a){ m.a.x = P(m.a.x); m.a.y = P(m.a.y); }
    if (m.b && 'x' in m.b){ m.b.x = P(m.b.x); m.b.y = P(m.b.y); }
  });
}

function deleteSel(){
  if (ui.sel?.kind==='furn'){ const id = ui.sel.id; ui.sel = null; mutate(() => state.furniture = state.furniture.filter(f => f.id !== id)); }
  else if (ui.sel?.kind==='lamp'){ const id = ui.sel.id; ui.sel = null; mutate(() => state.lamps = (state.lamps || []).filter(l => l.id !== id)); toast(tr('吸顶灯已删除','Ceiling light removed','Светильник удалён')); }
  else if (ui.sel?.kind==='bg'){ ui.sel = null; mutate(() => state.bg = null); toast(tr('Фон удалён', 'Background removed', 'Фон удалён')); }
  else if (ui.sel?.kind==='multi'){
    const items = ui.sel.items || []; ui.sel = null;
    mutate(() => {
      const wids = new Set(items.filter(i => i.kind==='wall').map(i => i.id));
      const kids = new Set(items.filter(i => i.kind==='open' && i.sub==='win').map(i => i.id));
      const dids = new Set(items.filter(i => i.kind==='open' && i.sub==='door').map(i => i.id));
      const fids = new Set(items.filter(i => i.kind==='furn').map(i => i.id));
      const lids = new Set(items.filter(i => i.kind==='line').map(i => i.id));
      const lpids = new Set(items.filter(i => i.kind==='lamp').map(i => i.id));
      state.walls = state.walls.filter(w => !wids.has(w.id));
      state.wins = state.wins.filter(w => !kids.has(w.id));
      state.doors = state.doors.filter(d => !dids.has(d.id));
      state.furniture = state.furniture.filter(f => !fids.has(f.id));
      state.lines = (state.lines || []).filter(l => !lids.has(l.id));
      state.lamps = (state.lamps || []).filter(l => !lpids.has(l.id));
    });
    toast(tr(`Удалено объектов: ${items.length} — отмена Ctrl+Z`, `Removed ${items.length} items — Ctrl+Z to undo`, `Удалено объектов: ${items.length} — отмена Ctrl+Z`));
  }
  else if (ui.sel?.kind==='wall'){ const id = ui.sel.id; ui.sel = null; mutate(() => state.walls = state.walls.filter(w => w.id !== id)); toast(tr('墙体已删除','Wall deleted','Стена удалена')); }
  else if (ui.sel?.kind==='line'){ const id = ui.sel.id; ui.sel = null; mutate(() => state.lines = (state.lines || []).filter(l => l.id !== id)); toast(tr('辅助线已删除','Guide line removed','Линия удалена')); }
  else if (ui.sel?.kind==='open'){
    const {sub, id} = ui.sel; ui.sel = null;
    mutate(() => { if (sub==='door') state.doors = state.doors.filter(d => d.id !== id); else state.wins = state.wins.filter(w => w.id !== id); });
    toast(tr('洞口已删除','Opening removed','Проём удалён'));
  }
}
function duplicateSel(){
  if (ui.sel?.kind !== 'furn') return;
  const f = getF(ui.sel.id), n = {...f, id:uid(), cx:f.cx+200, cy:f.cy+200};
  ui.sel = {kind:'furn', id:n.id}; mutate(() => state.furniture.push(n));
}
// 新放下的家具若压在墙 / 窗上，沿穿透较浅的方向推出来，刚好贴墙
function pushOut(f){
  for (let n = 0; n < 6; n++){
    let moved = false;
    for (const w of snapSegs()){
      const th = wallTh(w)/2, {hw, hh} = aabb(f);
      const dx = w.x1-w.x0, dy = w.y1-w.y0, L2 = dx*dx + dy*dy;
      let t = L2 ? ((f.cx-w.x0)*dx + (f.cy-w.y0)*dy)/L2 : 0; t = Math.max(0, Math.min(1, t));
      const px = w.x0 + t*dx, py = w.y0 + t*dy;
      const ddx = f.cx-px, ddy = f.cy-py, d = Math.hypot(ddx, ddy) || 1;
      const nx = ddx/d, ny = ddy/d;
      const need = th + hw*Math.abs(nx) + hh*Math.abs(ny);
      if (d >= need) continue;
      f.cx = px + nx*need; f.cy = py + ny*need; moved = true;
    }
    if (!moved) return;
  }
}
function addItem(it, x, y){
  const [type,name,w,d,color] = it, f = F(type,name,Math.round(x/10)*10,Math.round(y/10)*10,w,d,0,color);
  const [sx, sy] = snapMove(f, f.cx, f.cy); f.cx = sx; f.cy = sy;
  ui.sel = {kind:'furn', id:f.id};
  mutate(() => type==='rug' ? state.furniture.unshift(f) : state.furniture.push(f));
  toast(tr(`已添加「${name}」${w}×${d}`, `Added "${nm(name)}" ${w}×${d}`, `Добавлено «${name}» ${w}×${d}`));
}
function toggleWall(id){
  const w = getWall(id);
  if (!w) return;
  if (w.k === 'b' || w.k === 'b4') return toast(tr('承重墙（黑色）不可拆除', 'Load-bearing walls (black) cannot be removed', 'Несущую стену (чёрную) сносить нельзя'));

  const on = state.demolished.includes(id);
  mutate(() => state.demolished = on ? state.demolished.filter(x => x!==id) : [...state.demolished, id]);
  toast(on ? tr('已恢复墙体', 'Wall restored', 'Стена восстановлена') : tr(`已标记拆除 ${Math.round(segLen(w))} mm 墙体`, `Marked ${Math.round(segLen(w))} mm of wall for removal`, `Отмечено ${Math.round(segLen(w))} мм стены под снос`));
}

/* Панель выбора размера: проём (дверь/окно) или длина стены при рисовании */
function syncLenSeg(){
  const seg = $('#lenSeg'); if (!seg) return;
  const kind = (ui.tool === 'door' || ui.tool === 'win') ? ui.tool : (ui.tool === 'draw' ? 'wall' : null);
  seg.style.display = kind ? '' : 'none';
  if (!kind) return;
  seg.title = kind === 'wall'
    ? tr('Длина стены, мм — клик ещё раз выключает', 'Wall length, mm — click again to turn off', 'Длина стены, мм — клик ещё раз выключает')
    : tr('Размер проёма', 'Opening size', 'Размер проёма');
  const presets = kind === 'door' ? [700, 800, 900, 1000, 1200] : kind === 'win' ? [600, 900, 1200, 1500, 1800] : [500, 1000, 1500, 2000, 3000];
  const cur = kind === 'wall' ? ui.len.wall : ui.len[kind];
  const setLen = v => {
    if (kind === 'wall') ui.len.wall = (ui.len.wall === v ? null : v);   // повторный клик = свободная длина
    else ui.len[kind] = v;
    syncLenSeg(); syncModeHint();
  };
  seg.innerHTML = presets.map(v => `<button class="btn chip${cur === v ? ' on' : ''}" data-len="${v}">${v}</button>`).join('')
    + `<input type="number" id="lenIn" value="${cur ?? ''}" min="${kind === 'wall' ? 200 : 300}" max="${kind === 'wall' ? 20000 : 3000}" step="50"
         style="width:60px;border:1px solid var(--line);border-radius:8px;font:inherit;padding:3px 4px;margin-left:3px"
         title="${kind === 'wall' ? tr('Своя длина стены, мм (пусто — свободная)', 'Custom wall length, mm (empty = free)', 'Своя длина стены, мм (пусто — свободная)') : tr('Свой размер, мм', 'Custom size, mm', 'Свой размер, мм')}"
         placeholder="${tr('мм', 'mm', 'мм')}" aria-label="${kind === 'wall' ? tr('Длина стены, мм', 'Wall length, mm', 'Длина стены, мм') : tr('Размер проёма, мм', 'Opening size, mm', 'Размер проёма, мм')}">`;
  seg.querySelectorAll('[data-len]').forEach(b => b.onclick = () => setLen(+b.dataset.len));
  const inp = seg.querySelector('#lenIn');
  inp.onchange = () => {
    const raw = parseFloat(inp.value);
    if (kind === 'wall') ui.len.wall = isNaN(raw) ? null : Math.max(200, Math.min(20000, Math.round(raw/10)*10));
    else ui.len[kind] = Math.max(300, Math.min(3000, Math.round((raw || ui.len[kind])/10)*10));
    syncLenSeg(); syncModeHint();
  };
}

/* ======================= 视图 ======================= */
function applyView(){
  const W = svg.clientWidth, H = svg.clientHeight;
  svg.setAttribute('viewBox', `${view.x0} ${view.y0} ${W/view.s} ${H/view.s}`);
  const ratio = 1/(view.s*PX_MM);
  $('#ratio').textContent = '1:' + Math.round(ratio);
  const nice = [100,200,500,1000,2000,5000].find(v => v*view.s >= 60) || 5000;
  $('#sbBar').style.width = nice*view.s + 'px';
  $('#sbText').textContent = nice >= 1000 ? `${nice/1000} m` : `${nice} mm`;
  renderSel(); renderMeasure();
}
function fitView(){
  const W = svg.clientWidth, H = svg.clientHeight;
  view.s = Math.min(W/BOUNDS.w, H/BOUNDS.h);
  view.x0 = BOUNDS.x - (W/view.s - BOUNDS.w)/2; view.y0 = BOUNDS.y - (H/view.s - BOUNDS.h)/2;
  applyView();
}
function zoomAt(ns, mx, my){
  ns = Math.max(.012, Math.min(6, ns));
  const px = view.x0 + mx/view.s, py = view.y0 + my/view.s;
  view.s = ns; view.x0 = px - mx/ns; view.y0 = py - my/ns; applyView();
}
const zoomCenter = k => zoomAt(view.s*k, svg.clientWidth/2, svg.clientHeight/2);
const setRatio = r => zoomAt(1/(r*PX_MM), svg.clientWidth/2, svg.clientHeight/2);

function toMM(e){
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

/* ======================= 吸附 ======================= */
const grid = () => 10;
function snapMove(f, cx, cy){
  let nx = Math.round(cx/grid())*grid(), ny = Math.round(cy/grid())*grid();
  if (ui.layers.wallSnap){
    const {hw, hh} = aabb(f), tol = 150;            // радиус привязки к стене, мм
    let best = tol, bx = nx, by = ny;
    for (const w of snapSegs()){
      const th = wallTh(w)/2;
      const dx = w.x1-w.x0, dy = w.y1-w.y0, L = Math.hypot(dx, dy) || 1, ux = dx/L, uy = dy/L, px = -uy, py = ux;
      for (const s of [-1, 1]){
        const fx = w.x0 + s*th*px, fy = w.y0 + s*th*py;
        let t = (cx-fx)*ux + (cy-fy)*uy; t = Math.max(0, Math.min(L, t));
        const qx = fx + t*ux, qy = fy + t*uy;
        const ddx = cx-qx, ddy = cy-qy, d = Math.hypot(ddx, ddy) || 1;
        const nxu = ddx/d, nyu = ddy/d, supp = hw*Math.abs(nxu) + hh*Math.abs(nyu);
        const gap = Math.abs(d - supp);
        if (gap < best){ best = gap; bx = qx + nxu*supp; by = qy + nyu*supp; }
      }
    }
    nx = bx; ny = by;
  }
  // стены всегда «непрозрачны»: мебель не может зайти внутрь, выталкивается вплотную к грани
  return collideWalls(f, nx, ny);
}
function collideWalls(f, x, y){
  // выталкиваем мебель из стен по самому мелкому пересечению, вплотную к грани
  const tmp = {cx:x, cy:y, w:f.w, d:f.d, rot:f.rot};
  for (let n = 0; n < 8; n++){
    let moved = false;
    for (const w of snapSegs()){
      const th = wallTh(w)/2, {hw, hh} = aabb(tmp);
      const dx = w.x1-w.x0, dy = w.y1-w.y0, L2 = dx*dx + dy*dy;
      let t = L2 ? ((tmp.cx-w.x0)*dx + (tmp.cy-w.y0)*dy)/L2 : 0; t = Math.max(0, Math.min(1, t));
      const px = w.x0 + t*dx, py = w.y0 + t*dy;
      const ddx = tmp.cx-px, ddy = tmp.cy-py, d = Math.hypot(ddx, ddy) || 1;
      const nx = ddx/d, ny = ddy/d;
      const need = th + hw*Math.abs(nx) + hh*Math.abs(ny);
      if (d >= need) continue;
      tmp.cx = px + nx*need; tmp.cy = py + ny*need; moved = true;
    }
    if (!moved) break;
  }
  return [tmp.cx, tmp.cy];
}
function snapPoint(p, shift){
  let x = Math.round(p.x/10)*10, y = Math.round(p.y/10)*10;
  const tol = 8/view.s; let bd = tol;
  for (const w of snapSegs()){
    for (const [ex, ey] of [[w.x0,w.y0],[w.x1,w.y1]]){
      const d = Math.hypot(ex-p.x, ey-p.y); if (d < bd){ bd = d; x = ex; y = ey; }
    }
    const dx = w.x1-w.x0, dy = w.y1-w.y0, L2 = dx*dx + dy*dy;
    let t = L2 ? ((p.x-w.x0)*dx + (p.y-w.y0)*dy)/L2 : 0; t = Math.max(0, Math.min(1, t));
    const qx = w.x0 + t*dx, qy = w.y0 + t*dy, d = Math.hypot(qx-p.x, qy-p.y);
    if (d < bd){ bd = d; x = Math.round(qx/10)*10; y = Math.round(qy/10)*10; }
  }
  if (shift && ui.mA){ if (Math.abs(x-ui.mA.x) > Math.abs(y-ui.mA.y)) y = ui.mA.y; else x = ui.mA.x; }
  return {x, y};
}

/* ======================= Рисование стен / установка проёмов ======================= */
const activeWalls = () => state.walls.filter(w => !state.demolished.includes(w.id));
function nearestWall(p, tol){
  let best = tol, res = null;
  for (const w of activeWalls()){
    const L = segLen(w); if (L < 50) continue;
    const dx = w.x1-w.x0, dy = w.y1-w.y0, L2 = dx*dx + dy*dy;
    let t = ((p.x-w.x0)*dx + (p.y-w.y0)*dy)/L2; t = Math.max(0, Math.min(1, t));
    const qx = w.x0 + t*dx, qy = w.y0 + t*dy, d = Math.hypot(qx-p.x, qy-p.y);
    if (d < best){ best = d; res = {w, t, d}; }
  }
  return res;
}
function candidateOpening(p, lenDef){
  const c = nearestWall(p, Math.max(80, 12/view.s));
  if (!c) return null;
  const L = segLen(c.w), len = Math.min(lenDef, L*0.8);
  if (len < 300) return null;
  let s0 = c.t - (len/2)/L, s1 = c.t + (len/2)/L;
  if (s0 < 0){ s1 -= s0; s0 = 0; }
  if (s1 > 1){ s0 -= s1-1; s1 = 1; }
  if (s0 < 0 || (s1-s0)*L < 300) return null;
  return {w:c.w, s0, s1, len:(s1-s0)*L};
}
function splitWall(w, t0, t1){
  const L = segLen(w), at = t => [w.x0+(w.x1-w.x0)*t, w.y0+(w.y1-w.y0)*t];
  const pieces = [];
  if (t0 > 50/L){ const [x,y] = at(0), [X,Y] = at(t0); pieces.push({x0:x, y0:y, x1:X, y1:Y, k:w.k, th:w.th}); }
  if (t1 < 1-50/L){ const [x,y] = at(t1), [X,Y] = at(1); pieces.push({x0:x, y0:y, x1:X, y1:Y, k:w.k, th:w.th}); }
  const i = state.walls.indexOf(w);
  if (i >= 0) state.walls.splice(i, 1, ...pieces.map(p => ({id:wid(), ...p})));
}
function placeOpening(p, kind){
  const cand = candidateOpening(p, ui.len[kind] || (kind === 'door' ? 800 : 1200));
  if (!cand) return toast(tr('请点在墙体上', 'Click on a wall', 'Нажмите на стену'));
  const {w, s0, s1, len} = cand;
  const L = segLen(w), at = t => [w.x0+(w.x1-w.x0)*t, w.y0+(w.y1-w.y0)*t];
  const [ax, ay] = at(s0), [bx, by] = at(s1);
  if (kind === 'door'){
    const mx = (ax+bx)/2, my = (ay+by)/2, ux = (bx-ax)/len, uy = (by-ay)/len;
    let n = [-uy, ux];
    const inside = pt => ROOMS.some(r => pointInPoly(pt, r.poly));
    if (!inside([mx+n[0]*400, my+n[1]*400]) && inside([mx-n[0]*400, my-n[1]*400])) n = [uy, -ux];
    const c = [ux, uy];
    let o = [-c[1], c[0]];
    if (o[0]*n[0] + o[1]*n[1] < 0) o = [c[1], -c[0]];
    mutate(() => {
      splitWall(w, s0, s1);
      state.doors.push({id:wid(), name:'Дверь', a:[ax,ay], b:[bx,by], h:[ax,ay], c, o, len:Math.round(len), wt:wallTh(w)});
    });
    toast(tr(`已放置 ${Math.round(len)} mm 门`, `Door ${Math.round(len)} mm placed`, `Дверь ${Math.round(len)} мм`));
  } else {
    mutate(() => {
      splitWall(w, s0, s1);
      state.wins.push({id:wid(), x0:ax, y0:ay, x1:bx, y1:by, k:w.k, th:wallTh(w), sill:.9});
    });
    toast(tr(`已放置 ${Math.round(len)} mm 窗`, `Window ${Math.round(len)} mm placed`, `Окно ${Math.round(len)} мм`));
  }
}
function snapDrawPoint(p, shift){
  const tol = 8/view.s;
  let x = Math.round(p.x/10)*10, y = Math.round(p.y/10)*10, node = false, bd = tol;
  for (const w of snapSegs().concat(state.lines || [])){
    for (const [ex, ey] of [[w.x0,w.y0],[w.x1,w.y1]]){
      const d = Math.hypot(ex-p.x, ey-p.y); if (d < bd){ bd = d; x = ex; y = ey; node = true; }
    }
    const dx = w.x1-w.x0, dy = w.y1-w.y0, L2 = dx*dx + dy*dy;
    if (L2){
      let t = ((p.x-w.x0)*dx + (p.y-w.y0)*dy)/L2; t = Math.max(0, Math.min(1, t));
      const qx = w.x0+t*dx, qy = w.y0+t*dy, d = Math.hypot(qx-p.x, qy-p.y);
      if (d < bd){ bd = d; x = Math.round(qx/10)*10; y = Math.round(qy/10)*10; node = false; }
    }
  }
  const a = ui.drawFrom;
  if (a){
    if (shift){ if (Math.abs(x-a.x) > Math.abs(y-a.y)) y = a.y; else x = a.x; }
    else if (!node){
      const dx = x-a.x, dy = y-a.y, L = Math.hypot(dx, dy);
      if (L > 60){
        const ang = Math.atan2(dy, dx), sn = Math.round(ang/(Math.PI/4))*(Math.PI/4);
        if (Math.abs(ang - sn) < 0.06){ const r = L*Math.cos(ang - sn); x = a.x + Math.cos(sn)*r; y = a.y + Math.sin(sn)*r; }
      }
    }
  }
  return {x:Math.round(x), y:Math.round(y)};
}
function commitDraw(){
  const a = ui.drawFrom, b = ui.drawPrev;
  if (!a || !b) return;
  const L = Math.hypot(b.x-a.x, b.y-a.y);
  if (L < 60){ ui.drawFrom = null; renderDrawPreview(); return; }
  if (ui.tool === 'line'){
    ui.drawFrom = null; ui.drawPrev = null;
    mutate(() => state.lines.push({id:wid(), x0:a.x, y0:a.y, x1:b.x, y1:b.y}));
    return;
  }
  mutate(() => state.walls.push({id:wid(), x0:a.x, y0:a.y, x1:b.x, y1:b.y, k:ui.wallK}));
  ui.drawFrom = {x:b.x, y:b.y};        // продолжить цепочку
}
function renderDrawPreview(){
  const g = $('#gDraw'); if (!g) return;

  if ((ui.tool === 'draw' || ui.tool === 'line') && ui.drawFrom && ui.drawPrev){
    const a = ui.drawFrom, b = ui.drawPrev, L = Math.round(Math.hypot(b.x-a.x, b.y-a.y));
    if (ui.tool === 'line'){
      s += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#2f5d62" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-dasharray="8 5"/>
        <circle cx="${a.x}" cy="${a.y}" r="${7/view.s}" fill="#fff" stroke="#2f5d62" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
        <circle cx="${b.x}" cy="${b.y}" r="${5/view.s}" fill="#2f5d62"/>
        <text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2 - 14/view.s}" font-size="${13/view.s}" text-anchor="middle" fill="#2f5d62"
          stroke="#fff" stroke-width="${3/view.s}" paint-order="stroke">${fmtL(L)}</text>`;
      g.innerHTML = s; return;
    }
    const S = 'stroke="#b5653a" stroke-width="2" vector-effect="non-scaling-stroke"';
    s += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#b5653a" stroke-opacity=".35" stroke-width="${WTH[ui.wallK] || 150}"/>
      <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" ${S} stroke-dasharray="8 5"/>
      <circle cx="${a.x}" cy="${a.y}" r="${7/view.s}" fill="#fff" ${S}/>
      <circle cx="${b.x}" cy="${b.y}" r="${5/view.s}" fill="#b5653a"/>

        stroke="#fff" stroke-width="${3/view.s}" paint-order="stroke">${fmtL(L)}</text>`;

  }

    const r = ui.areaRect;
    const x0 = Math.min(r.x0, r.x1), y0 = Math.min(r.y0, r.y1), w = Math.abs(r.x1 - r.x0), h = Math.abs(r.y1 - r.y0);
    s += `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="rgba(181,101,58,.10)" stroke="#b5653a" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-dasharray="6 4"/>`;
  }

/* ======================= 指针交互 ======================= */
let drag = null, pinch = null;
const touches = new Map();                     // 当前按在平面图上的手指
const svgXY = (x, y) => { const r = svg.getBoundingClientRect(); return [x - r.left, y - r.top]; };
function pinchInfo(){
  const [a, b] = [...touches.values()];
  return {d:Math.max(1, Math.hypot(b.x-a.x, b.y-a.y)), c:svgXY((a.x+b.x)/2, (a.y+b.y)/2)};
}
// 结束当前拖动：移动过的家具记入撤销栈
function endDrag(cancel){
  const d = drag; drag = null; svg.classList.remove('panning');
  if (!d) return;
  if (d.kind === 'measure'){
    if (cancel){ ui.mA = ui.mCur = null; renderMeasure(); return; }
    if (d.moved && ui.mA && ui.mCur && Math.hypot(ui.mCur.x-ui.mA.x, ui.mCur.y-ui.mA.y) > 20){
      const a = ui.mA, b = ui.mCur; ui.mA = ui.mCur = null; mutate(() => state.measures.push({a, b}));
    }
    renderMeasure(); return;                   // 没拖动：保留起点，等第二次点击
  }
  if (d.kind === 'area'){
    const rect = ui.areaRect; ui.areaRect = null; renderDrawPreview();
    if (cancel || !d.moved || !rect) return;   // маленький тап — просто сброс, инструмент остаётся
    const items = [];
    WALLS.forEach(w => { if (segRectHit(w.x0, w.y0, w.x1, w.y1, rect)) items.push({kind:'wall', id:w.id}); });
    WINS.forEach(w => { if (segRectHit(w.x0, w.y0, w.x1, w.y1, rect)) items.push({kind:'open', sub:'win', id:w.id}); });
    DOORS.forEach(dr => {
      if (Array.isArray(dr.a) && Array.isArray(dr.b) && segRectHit(dr.a[0], dr.a[1], dr.b[0], dr.b[1], rect))
        items.push({kind:'open', sub:'door', id:dr.id});
    });
    state.furniture.forEach(f => {
      const {hw, hh} = aabb(f);
      if (rectsOverlap({x0:f.cx-hw, y0:f.cy-hh, x1:f.cx+hw, y1:f.cy+hh}, rect)) items.push({kind:'furn', id:f.id});
    });
    (state.lines || []).forEach(l => { if (segRectHit(l.x0, l.y0, l.x1, l.y1, rect)) items.push({kind:'line', id:l.id}); });
    const rx0 = Math.min(rect.x0, rect.x1), rx1 = Math.max(rect.x0, rect.x1), ry0 = Math.min(rect.y0, rect.y1), ry1 = Math.max(rect.y0, rect.y1);
    (state.lamps || []).forEach(l => { if (l.x >= rx0 && l.x <= rx1 && l.y >= ry0 && l.y <= ry1) items.push({kind:'lamp', id:l.id}); });
    setTool('select');
    if (items.length){
      ui.sel = {kind:'multi', items};
      renderSel(); renderPanel();
      toast(tr(`Выделено объектов: ${items.length} — Delete удалит`, `Selected ${items.length} items — Delete removes them`, `Выделено объектов: ${items.length} — Delete удалит`));
    } else toast(tr('В области ничего нет', 'Nothing inside the area', 'В области ничего нет'));
    return;
  }
  if (d.kind === 'pan'){
    if (!cancel && !d.moved && ui.tool === 'select'){
      if (d.room) select({kind:'room', id:d.room});
      else if (!d.noDeselect) select(null);
    }
    return;
  }
  if (d.kind === 'bgmove'){
    if (d.moved){ commit(d.before); renderAll(); }
    else select(null);                         // клик по выделенному фону = снять выделение
    return;
  }
  if (d.moved){ commit(d.before); renderAll(); }
}

svg.addEventListener('pointerdown', e => {
  if (e.button === 1 || e.button === 2) return;
  closeDrawers(); document.querySelectorAll('details.menu').forEach(d => d.open = false);
  if (e.pointerType !== 'mouse'){
    touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
    svg.setPointerCapture(e.pointerId);
    if (touches.size >= 2){                    // 第二根手指落下：取消单指操作，进入双指缩放 / 平移
      endDrag(drag?.kind === 'measure' || drag?.kind === 'pan');
      const {d, c} = pinchInfo();
      pinch = {d, c, s:view.s, px:view.x0 + c[0]/view.s, py:view.y0 + c[1]/view.s};
      return;
    }
  }
  if (pinch) return;
  const p = toMM(e), t = e.target;
  if (ui.calib){
    const q = {x:Math.round(p.x/10)*10, y:Math.round(p.y/10)*10};
    if (!ui.calib.p1){ ui.calib.p1 = q; syncModeHint(); return; }
    const a = ui.calib.p1, d = Math.hypot(q.x-a.x, q.y-a.y);
    if (d < 50){ toast(tr('Слишком короткий отрезок', 'Segment is too short', 'Слишком короткий отрезок')); return; }
    const ans = prompt(tr('Реальная длина отрезка, мм', 'Real length of the segment, mm', 'Реальная длина отрезка, мм'), '800');
    const real = parseFloat(ans);
    ui.calib = null;
    if (!(real > 10)){ syncModeHint(); return; }
    const k = real / d;
    mutate(() => {
      const b = state.bg; if (!b) return;
      b.w = Math.round(b.w*k); b.h = Math.round(b.h*k);
      b.x = Math.round(a.x + (b.x-a.x)*k); b.y = Math.round(a.y + (b.y-a.y)*k);
      b.cal = Math.round((b.cal || 1) * k * 1000) / 1000;
    });
    syncModeHint();
    toast(tr(`Масштаб фона: ×${k.toFixed(3)}`, `Background scale: ×${k.toFixed(3)}`, `Масштаб фона: ×${k.toFixed(3)}`));
    return;
  }
  if (ui.tool === 'measure'){
    const q = snapPoint(p, e.shiftKey);
    if (!ui.mA){ ui.mA = q; ui.mCur = q; drag = {kind:'measure', sx:e.clientX, sy:e.clientY, moved:false}; svg.setPointerCapture(e.pointerId); }
    else { const a = ui.mA; ui.mA = null; ui.mCur = null; if (Math.hypot(q.x-a.x, q.y-a.y) > 20) mutate(() => state.measures.push({a, b:q})); }
    renderMeasure(); return;
  }
  if (ui.tool === 'area'){
    drag = {kind:'area', sx:e.clientX, sy:e.clientY, x0:p.x, y0:p.y, moved:false};
    ui.areaRect = {x0:p.x, y0:p.y, x1:p.x, y1:p.y};
    svg.setPointerCapture(e.pointerId); return;
  }
  const h = t.closest('[data-handle]');
  const wallEl = t.closest('[data-wall]');
  const openEl = t.closest('[data-open]');
  const bgEl = t.closest('[data-bg]');
  const lineEl = t.closest('[data-line]');
  const lampEl = t.closest('[data-lamp]');
  if (h && (ui.sel?.kind === 'wall' || ui.sel?.kind === 'line') && (h.dataset.handle === 'wa' || h.dataset.handle === 'wb')){
    drag = {kind:h.dataset.handle, id:ui.sel.id, line:ui.sel.kind === 'line', sx:e.clientX, sy:e.clientY, before:snap(), moved:false};
  } else if (h && ui.sel?.kind === 'furn'){
    drag = {kind:h.dataset.handle, id:ui.sel.id, sx:e.clientX, sy:e.clientY, before:snap(), moved:false};
  } else if (ui.tool === 'draw' || ui.tool === 'line'){
    if (!ui.drawFrom){ ui.drawFrom = snapDrawPoint(p, e.shiftKey); ui.drawPrev = {...ui.drawFrom}; }
    else commitDraw();
    renderDrawPreview();
    svg.setPointerCapture(e.pointerId); return;
  } else if (ui.tool === 'door' || ui.tool === 'win'){
    placeOpening(p, ui.tool);
    svg.setPointerCapture(e.pointerId); return;
  } else if (ui.tool === 'demolish' && wallEl){
    toggleWall(wallEl.dataset.wall); return;
  } else if (ui.tool === 'select' && wallEl){
    select({kind:'wall', id:wallEl.dataset.wall});
    drag = {kind:'pan', sx:e.clientX, sy:e.clientY, x0:view.x0, y0:view.y0, room:null, noDeselect:true, moved:false};
  } else if (ui.tool === 'select' && openEl){
    select({kind:'open', sub:openEl.dataset.open, id:openEl.dataset.oid});
    drag = {kind:'pan', sx:e.clientX, sy:e.clientY, x0:view.x0, y0:view.y0, room:null, noDeselect:true, moved:false};
  } else if (ui.tool === 'select' && lineEl){
    select({kind:'line', id:lineEl.dataset.line});
    drag = {kind:'pan', sx:e.clientX, sy:e.clientY, x0:view.x0, y0:view.y0, room:null, noDeselect:true, moved:false};
  } else if (ui.tool === 'select' && bgEl && state.bg && ui.sel?.kind === 'bg'){
    if (e.shiftKey || state.bg.lock)
      drag = {kind:'pan', sx:e.clientX, sy:e.clientY, x0:view.x0, y0:view.y0, room:null, noDeselect:true, moved:false};
    else
      drag = {kind:'bgmove', sx:e.clientX, sy:e.clientY, ox:p.x-state.bg.x, oy:p.y-state.bg.y, before:snap(), moved:false};
  } else if (ui.tool === 'select' && lampEl){
    const lp = getLamp(lampEl.dataset.lamp);
    if (lp){
      select({kind:'lamp', id:lp.id});
      drag = {kind:'lampmove', id:lp.id, sx:e.clientX, sy:e.clientY, ox:p.x-lp.x, oy:p.y-lp.y, before:snap(), moved:false};
    }
  } else if (ui.tool === 'select' && t.closest('[data-fid]')){
    const f = getF(t.closest('[data-fid]').dataset.fid);
    if (ui.sel?.id !== f.id) select({kind:'furn', id:f.id});
    drag = {kind:'move', id:f.id, sx:e.clientX, sy:e.clientY, ox:p.x-f.cx, oy:p.y-f.cy, before:snap(), moved:false};
  } else {
    const room = t.closest('[data-room]');
    drag = {kind:'pan', sx:e.clientX, sy:e.clientY, x0:view.x0, y0:view.y0, room:room && room.dataset.room, moved:false};
  }
  svg.setPointerCapture(e.pointerId);
});

svg.addEventListener('pointermove', e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch){
    if (touches.size < 2) return;
    const {d, c} = pinchInfo(), ns = Math.max(.012, Math.min(2, pinch.s * d / pinch.d));
    view.s = ns; view.x0 = pinch.px - c[0]/ns; view.y0 = pinch.py - c[1]/ns; applyView();
    return;
  }
  const p = toMM(e);
  $('#cx').textContent = fmtL(p.x); $('#cy').textContent = fmtL(p.y);
  if (!drag){
    const room = e.target.closest && e.target.closest('[data-room]');
    $('#hover').innerHTML = room ? `<b>${esc(state.rooms[room.dataset.room].name)}</b> ${fmt(rArea(ROOMS.find(r=>r.id===room.dataset.room)))} m²` : '';
    if (ui.tool === 'measure' && ui.mA){ ui.mCur = snapPoint(p, e.shiftKey); renderMeasure(); }
    if ((ui.tool === 'draw' || ui.tool === 'line') && ui.drawFrom){
      ui.drawPrev = snapDrawPoint(p, e.shiftKey);
      if (ui.tool === 'draw' && ui.len.wall){                    // фиксированная длина стены
        const dx = ui.drawPrev.x - ui.drawFrom.x, dy = ui.drawPrev.y - ui.drawFrom.y, d = Math.hypot(dx, dy);
        if (d > 1) ui.drawPrev = {x: Math.round(ui.drawFrom.x + dx/d*ui.len.wall), y: Math.round(ui.drawFrom.y + dy/d*ui.len.wall)};
      }
      renderDrawPreview();
    }
    else if (ui.tool === 'door' || ui.tool === 'win'){ ui.openPrev = candidateOpening(p, ui.len[ui.tool] || 800); renderDrawPreview(); }
    return;
  }
  const far = Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) >= TAP;
  if (drag.kind === 'measure'){
    if (far) drag.moved = true;
    ui.mCur = snapPoint(p, e.shiftKey); renderMeasure(); return;
  }
  if (drag.kind === 'area'){
    if (!drag.moved && !far) return;
    drag.moved = true;
    ui.areaRect = {x0:drag.x0, y0:drag.y0, x1:p.x, y1:p.y};
    renderDrawPreview(); return;
  }
  if (drag.kind === 'pan'){
    if (!drag.moved && !far) return;
    drag.moved = true; svg.classList.add('panning');
    view.x0 = drag.x0 - (e.clientX-drag.sx)/view.s; view.y0 = drag.y0 - (e.clientY-drag.sy)/view.s; applyView(); return;
  }
  if (drag.kind === 'wa' || drag.kind === 'wb'){
    const o = drag.line ? (state.lines || []).find(x => x.id === drag.id) : getWall(drag.id);
    if (!o) return;
    if (!drag.moved && !far) return;
    drag.moved = true;
    const q = snapDrawPoint(p, e.shiftKey);
    if (drag.kind === 'wa'){ o.x0 = q.x; o.y0 = q.y; } else { o.x1 = q.x; o.y1 = q.y; }
    if (drag.line){ renderLines(); renderSel(); }
    else { renderWalls(); renderSel(); renderDims(); renderOpenings(); }
    return;
  }
  if (drag.kind === 'bgmove'){
    const b = state.bg; if (!b) return;
    if (!drag.moved && !far) return;
    drag.moved = true;
    b.x = Math.round(p.x - drag.ox); b.y = Math.round(p.y - drag.oy);
    renderBg(); renderSel(); return;
  }
  if (drag.kind === 'lampmove'){
    const lp = getLamp(drag.id); if (!lp) return;
    if (!drag.moved && !far) return;
    drag.moved = true;
    lp.x = Math.round((p.x - drag.ox)/10)*10; lp.y = Math.round((p.y - drag.oy)/10)*10;
    renderLamps(); renderSel(); return;
  }
  const f = getF(drag.id); if (!f) return;
  if (!drag.moved && !far) return;             // 轻点家具不应让它抖动一下
  drag.moved = true;
  if (drag.kind === 'move'){
    [f.cx, f.cy] = snapMove(f, p.x-drag.ox, p.y-drag.oy);
  } else if (drag.kind === 'rot'){
    let a = Math.atan2(p.y-f.cy, p.x-f.cx)*180/Math.PI + 90;
    f.rot = norm(e.shiftKey ? a : Math.round(a/15)*15);
  } else if (drag.kind === 'size'){
    const a = f.rot*Math.PI/180, c = Math.cos(a), s = Math.sin(a);
    const dx = p.x-f.cx, dy = p.y-f.cy, lx = dx*c + dy*s, ly = -dx*s + dy*c;
    const ax = -f.w/2, ay = -f.d/2;
    const nw = Math.max(100, Math.round((lx-ax)/10)*10), nd = Math.max(100, Math.round((ly-ay)/10)*10);
    const mx = ax + nw/2, my = ay + nd/2;
    f.cx += mx*c - my*s; f.cy += mx*s + my*c; f.w = nw; f.d = nd;
  }
  renderFurn(); renderSel();
});

function onPointerEnd(e){
  touches.delete(e.pointerId);
  if (pinch){ if (touches.size < 2) pinch = null; return; }   // 双指结束后，剩下的手指不再触发操作
  endDrag(e.type === 'pointercancel');
}
svg.addEventListener('pointerup', onPointerEnd);
svg.addEventListener('pointercancel', onPointerEnd);
// 阻止 iPad Safari 把双指手势当成整页缩放
['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(view.s*Math.exp(-e.deltaY*(e.ctrlKey ? .01 : .0015)), e.clientX-r.left, e.clientY-r.top);
}, {passive:false});
svg.addEventListener('dblclick', e => { if (ui.tool==='select' && e.target.closest('[data-fid]')) rotateSel(90); });
svg.addEventListener('contextmenu', e => {
  if (ui.tool === 'measure'){ e.preventDefault(); ui.mA = null; renderMeasure(); }
  else if ((ui.tool === 'draw' || ui.tool === 'line') && ui.drawFrom){ e.preventDefault(); ui.drawFrom = null; ui.drawPrev = null; renderDrawPreview(); }
});

/* ======================= 键盘 ======================= */
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (window.View3D?.walking()) return;
  const mod = e.metaKey || e.ctrlKey, code = e.code;
  if (mod && code === 'KeyZ'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && code === 'KeyY'){ e.preventDefault(); redo(); return; }
  if (mod && code === 'KeyD'){ e.preventDefault(); duplicateSel(); return; }
  if (mod) return;
  if (code === 'BracketLeft' || code === 'BracketRight'){ drawer(code === 'BracketLeft' ? 'lib' : 'panel'); return; }
  if (code === 'KeyF' && e.shiftKey){ toggleFullscreen(); return; }
  if (code === 'KeyT') setView(is3D() ? '2d' : '3d');
  else if (is3D() && ['KeyV','KeyM','KeyX','KeyF','Equal','Minus','KeyW','KeyD','KeyN','KeyA','KeyL'].includes(code)) return;
  else if (code === 'KeyV') setTool('select');
  else if (code === 'KeyW') setTool('draw');
  else if (code === 'KeyD') setTool('door');
  else if (code === 'KeyN') setTool('win');
  else if (code === 'KeyL') setTool('line');
  else if (code === 'KeyM') setTool('measure');
  else if (code === 'KeyX') setTool('demolish');
  else if (code === 'KeyA') setTool('area');
  else if (code === 'KeyF') fitView();
  else if (code === 'KeyR') rotateSel(e.shiftKey ? -90 : 90);
  else if (code === 'Delete' || code === 'Backspace'){ e.preventDefault(); deleteSel(); }
  else if (code === 'Escape'){
    if (ui.calib){ ui.calib = null; syncModeHint(); }
    else if (ui.mA){ ui.mA = null; renderMeasure(); }
    else if (ui.drawFrom){ ui.drawFrom = null; ui.drawPrev = null; renderDrawPreview(); }
    else { if (ui.tool !== 'select') setTool('select'); select(null); }
  }
  else if (code.startsWith('Arrow') && (ui.sel?.kind === 'furn' || ui.sel?.kind === 'bg' || ui.sel?.kind === 'lamp')){
    e.preventDefault(); const st = e.shiftKey ? 100 : 10;
    mutate(() => {
      if (ui.sel.kind === 'bg'){
        const b = state.bg; if (!b) return;
        if (code==='ArrowLeft') b.x -= st; if (code==='ArrowRight') b.x += st;
        if (code==='ArrowUp') b.y -= st; if (code==='ArrowDown') b.y += st;
      } else if (ui.sel.kind === 'lamp'){
        const lp = getLamp(ui.sel.id); if (!lp) return;
        if (code==='ArrowLeft') lp.x -= st; if (code==='ArrowRight') lp.x += st;
        if (code==='ArrowUp') lp.y -= st; if (code==='ArrowDown') lp.y += st;
      } else {
        const f = getF(ui.sel.id); if (!f) return;
        let nx = f.cx, ny = f.cy;
        if (code==='ArrowLeft') nx -= st; if (code==='ArrowRight') nx += st;
        if (code==='ArrowUp') ny -= st; if (code==='ArrowDown') ny += st;
        [f.cx, f.cy] = snapMove(f, nx, ny);
      }
    });
  }
  else if (code === 'Equal') zoomCenter(1.25);
  else if (code === 'Minus') zoomCenter(.8);
});

function buildLib(){
  $('#lib').innerHTML = LIB.map((c,ci) => `<h4>${nm(c.cat)}</h4><div class="lib-grid">${c.items.map((it,ii) => {
    const [t,n,w,d,col] = it, pad = Math.max(w,d)*.08;
    return `<div class="item" data-key="${ci}:${ii}" title="${tr('点击添加，或拖到平面图中的指定位置', 'Click to add, or drag onto the plan', 'Нажмите, чтобы добавить, или перетащите на план')}">
      <svg viewBox="${-w/2-pad} ${-d/2-pad} ${w+2*pad} ${d+2*pad}">${furnSVG(t,w,d,col)}</svg><b>${esc(nm(n))}</b><small>${w}×${d}</small></div>`;
  }).join('')}</div>`).join('') + `<div class="hint">${tr(
    `家具按真实尺寸（mm）绘制。${COARSE ? '点一下放到画面中央，或按住向右拖到平面图 / 3D 地面上的指定位置（上下滑动为滚动列表）。' : '点击添加到画面中央，或直接拖到平面图 / 3D 地面上。'}添加后可在右侧修改宽深与颜色。`,
    `Furniture is drawn at real size (mm). ${COARSE ? 'Tap to place at the center, or hold and drag right onto the plan / 3D floor (swipe up/down to scroll).' : 'Click to add at the center, or drag onto the plan / 3D floor.'} Edit size and color in the right panel afterwards.`, `Мебель нарисована в реальном размере (мм). ${COARSE ? 'Тапните, чтобы поставить в центр, или удерживайте и тяните вправо на план / пол 3D (список прокручивается свайпом вверх/вниз).' : 'Тапните, чтобы поставить в центр, или сразу перетащите на план / пол 3D.'} Размеры и цвет меняются в правой панели.`)}</div>`;
  document.querySelectorAll('.item').forEach(el => el.addEventListener('pointerdown', e => {
    if (e.button) return;
    libDrag = {el, id:e.pointerId, sx:e.clientX, sy:e.clientY, it:itemOf(el), ghost:null};
  }));
}
const itemOf = el => { const [ci, ii] = el.dataset.key.split(':').map(Number); return LIB[ci].items[ii]; };

// 家具库拖放：用 pointer 事件实现（iPad 上 HTML5 拖放不可靠）。
// 列表设置了 touch-action:pan-y，竖向滑动交给浏览器滚动（会触发 pointercancel），横向拖动才开始拖放。
let libDrag = null;
// 屏幕坐标 → 户型坐标（mm）。2D 取平面图坐标，3D 取射线与地面的交点；s = 该处每 mm 的屏幕像素数
function dropPoint(x, y){
  const r = $('#stage').getBoundingClientRect();
  if (x < r.left || x > r.right || y < r.top || y > r.bottom) return null;
  if (document.elementFromPoint(x, y)?.closest('aside.open,#fab,#walkOverlay,#joy,#walkExit')) return null;
  if (is3D()) return window.View3D?.groundAt(x, y) || null;
  const p = toMM({clientX:x, clientY:y}); return {x:p.x, y:p.y, s:view.s};
}
addEventListener('pointermove', e => {
  if (!libDrag || e.pointerId !== libDrag.id) return;
  const {it} = libDrag;
  if (!libDrag.ghost){
    if (Math.hypot(e.clientX-libDrag.sx, e.clientY-libDrag.sy) < TAP) return;
    const g = libDrag.ghost = document.createElement('div'); g.id = 'ghost';
    g.innerHTML = `<svg viewBox="${-it[2]/2} ${-it[3]/2} ${it[2]} ${it[3]}">${furnSVG(it[0],it[2],it[3],it[4])}</svg>`;
    document.body.appendChild(g); libDrag.el.classList.add('dragging');
  }
  // 幽灵图按落点处的比例显示真实大小（3D 中近大远小）
  const g = libDrag.ghost, s = Math.max(dropPoint(e.clientX, e.clientY)?.s || (is3D() ? .05 : view.s), .02);
  Object.assign(g.style, {width:Math.max(28, it[2]*s)+'px', height:Math.max(20, it[3]*s)+'px', left:e.clientX+'px', top:e.clientY+'px'});
  const lib = $('aside.lib');
  if (narrow() && lib.classList.contains('open') && e.clientX > lib.getBoundingClientRect().right) drawer(null);   // 拖出抽屉后自动收起
});
function endLibDrag(e, ok){
  if (!libDrag || e.pointerId !== libDrag.id) return;
  const d = libDrag; libDrag = null;
  d.el.classList.remove('dragging');
  if (d.ghost){
    d.ghost.remove();
    if (!ok) return;
    const p = dropPoint(e.clientX, e.clientY);
    if (p) addItem(d.it, p.x, p.y);
    else if (is3D() && e.clientX > $('#stage').getBoundingClientRect().left) toast(tr('请拖到地面上', 'Drop it on the floor', 'Перетащите на пол'));
    return;
  }
  if (!ok) return;
  // 轻点：放到选中房间中心，否则放到画面中心（3D 取屏幕中心对应的地面位置）
  let p = null;
  if (ui.sel?.kind === 'room'){ const b = bbox(ROOMS.find(r => r.id===ui.sel.id).poly); p = {x:(b[0]+b[2])/2, y:(b[1]+b[3])/2}; }
  else if (is3D()){ const r = $('#stage').getBoundingClientRect(); p = window.View3D.groundAt(r.left + r.width/2, r.top + r.height/2); }
  if (!p) p = {x:view.x0 + svg.clientWidth/2/view.s, y:view.y0 + svg.clientHeight/2/view.s};
  addItem(d.it, p.x, p.y);
  closeDrawers();
}
addEventListener('pointerup', e => endLibDrag(e, true));
addEventListener('pointercancel', e => endLibDrag(e, false));

function download(name, blob){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function exportPNG(){
  if (is3D()) return window.View3D.shot();
  const clone = svg.cloneNode(true), W = 3200, H = Math.round(W*BOUNDS.h/BOUNDS.w);
  clone.setAttribute('viewBox', `${BOUNDS.x} ${BOUNDS.y} ${BOUNDS.w} ${BOUNDS.h}`);
  clone.setAttribute('width', W); clone.setAttribute('height', H);
  clone.querySelector('#gSel').innerHTML = '';
  clone.querySelector('#gGrid').innerHTML = `<rect x="-20000" y="-20000" width="55000" height="55000" fill="${ui.layers.grid?'url(#grid)':'#f7f4ee'}"/>`;
  const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
  Object.entries({x:-20000,y:-20000,width:55000,height:55000,fill:'#f7f4ee'}).forEach(([k,v]) => bg.setAttribute(k,v));
  clone.insertBefore(bg, clone.querySelector('#gGrid'));
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    cv.getContext('2d').drawImage(img, 0, 0, W, H);
    cv.toBlob(b => download(tr('户型装修方案', 'floor-plan-design', 'floor-plan-design') + '.png', b));
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
}

  : {'2d':tr('拖动左侧家具到平面图 · 滚轮缩放 · 拖动空白处平移 · T 切换 3D', 'Drag furniture onto the plan · scroll to zoom · drag empty space to pan · T for 3D', 'Тяните мебель слева на план · колесо — масштаб · пустое место — панорама · T — 3D'),

async function setView(m){
  if (m === viewMode || switching) return;
  if (!window.View3D) return toast(tr('3D 引擎仍在加载或加载失败（需要联网加载 three.js）', '3D engine is still loading or failed to load (three.js needs a network connection)', '3D-движок ещё грузится или не загрузился (three.js требует доступ в интернет)'));
  switching = true; document.body.classList.add('busy');

/* Выпадающие меню: позиционируем fixed и прижимаем к экрану, чтобы не уезжали за край.
   left/top считаем через дельту: анимация .only2d (fill:both) превращает кнопку в
   containing block для fixed-потомков, и попап может считаться от неё, а не от окна. */
function placeMenus(){
  document.querySelectorAll('details.menu').forEach(d => {
    if (!d.open) return;
    const p = d.querySelector('.menu-pop'), s = d.querySelector('summary');
    if (!p || !s) return;
    p.style.left = '0px'; p.style.top = '0px';          // нулевая точка для замера
    const r = p.getBoundingClientRect(), rs = s.getBoundingClientRect(), M = 8;
    let X = Math.min(Math.max(rs.right - r.width, M), innerWidth - r.width - M);
    let Y = rs.bottom + 6;
    if (Y + r.height > innerHeight - M) Y = Math.max(M, rs.top - 6 - r.height);
    p.style.left = Math.round(X - r.x) + 'px';          // дельта от фактического origin
    p.style.top = Math.round(Y - r.y) + 'px';
  });
}
document.querySelectorAll('details.menu').forEach(d => d.addEventListener('toggle', placeMenus));
addEventListener('resize', placeMenus);

<script type="module">
/* ============================================================
 *  3D 场景（three.js）—— 与 2D 共用 state / ui，切换时带过渡动画：
 *  2D → 3D：3D 相机先以正俯视对齐当前 2D 视口（比例、位置一致），
 *           交叉淡入后镜头倾斜环绕、墙体从地面升起、家具随后立起；
 *  3D → 2D：反向——家具收起、墙体下沉、镜头回到正俯视并淡出到平面图。
 * ============================================================ */
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {PointerLockControls} from 'three/addons/controls/PointerLockControls.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {CSS2DRenderer, CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';

const stage = $('#stage'), host = $('#view3d');
const OX = 3600, OY = 3400, H = 2.8, FOV = 45;       // 户型中心放在世界原点，层高 2.8 m
const wx = x => (x - OX) / 1000, wz = y => (y - OY) / 1000, M = v => v / 1000;
const SW = () => stage.clientWidth, SH = () => stage.clientHeight;
const opt = {cut:2.8, furn:true, labels:true, night:false, hour:10, mode:'orbit'};

let inited = false, active = false, raf = 0, anim = null, fly = null;
let renderer, labelRenderer, scene, camera, orbit, walkCtl, hemi, sun, ground, glassMat, wallMat, capMat, frameMat;
let archFloor, archUp, furnG, labelG, lampG, colliders = [], selKey = null, selHelper = null;
let sigArch = '', sigFurn = '', sigLabels = '', grow = 1, furnGrow = 1;
const doors = [], keys = {};

/* ======================= 初始化 ======================= */
function init(){
  if (inited) return; inited = true;
  renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(SW(), SH());
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  host.prepend(renderer.domElement);
  labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(SW(), SH());
  Object.assign(labelRenderer.domElement.style, {position:'absolute', inset:'0', pointerEvents:'none'});
  host.appendChild(labelRenderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, SW()/SH(), .05, 300);
  orbit = new OrbitControls(camera, renderer.domElement);
  orbit.enableDamping = true; orbit.maxPolarAngle = Math.PI*.495; orbit.minDistance = 1.5; orbit.maxDistance = 45;
  walkCtl = new PointerLockControls(camera, document.body);
  walkCtl.addEventListener('lock', () => { $('#walkOverlay').style.display = 'none'; $('#cross').style.display = 'block'; });
  walkCtl.addEventListener('unlock', () => { if (opt.mode === 'walk'){ $('#walkOverlay').style.display = 'flex'; $('#cross').style.display = 'none'; } });

  hemi = new THREE.HemisphereLight(0xfff8ee, 0xb9a88f, 1.1);
  sun = new THREE.DirectionalLight(0xfff1dd, 2.6);
  sun.castShadow = true; sun.shadow.mapSize.setScalar(COARSE ? 2048 : 4096);   // 平板 GPU 用小一点的阴影贴图
  Object.assign(sun.shadow.camera, {left:-11, right:11, top:11, bottom:-11, near:1, far:60});
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
  ground = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), new THREE.MeshStandardMaterial({color:0xf2eee7, roughness:1}));
  ground.rotation.x = -Math.PI/2; ground.position.y = -0.015; ground.receiveShadow = true;
  scene.add(hemi, sun, sun.target, ground);

  const pm = new THREE.PMREMGenerator(renderer); envTex = pm.fromScene(new RoomEnvironment(), .04).texture; pm.dispose();
  glassMat = new THREE.MeshPhysicalMaterial({color:0xcfe6ef, roughness:.05, transparent:true, opacity:.28, depthWrite:false, side:THREE.DoubleSide});
  wallMat = mat('#f4f1eb', {roughness:.92}); capMat = mat('#34312d', {roughness:.9}); frameMat = mat('#5d6166', {roughness:.5, metalness:.4});

  archFloor = new THREE.Group(); archUp = new THREE.Group(); furnG = new THREE.Group(); labelG = new THREE.Group(); lampG = new THREE.Group();
  scene.add(archFloor, archUp, furnG, labelG, lampG);

  const cv = renderer.domElement; let downAt = null, look = null;
  cv.addEventListener('pointerdown', e => {
    downAt = [e.clientX, e.clientY]; window.closeDrawers();
    if (touchWalk && !look){ look = {id:e.pointerId, x:e.clientX, y:e.clientY}; cv.setPointerCapture(e.pointerId); }
  });
  cv.addEventListener('pointermove', e => {
    if (!look || e.pointerId !== look.id) return;
    lookBy(e.clientX - look.x, e.clientY - look.y); look.x = e.clientX; look.y = e.clientY;
  });
  cv.addEventListener('pointercancel', e => { if (look?.id === e.pointerId) look = null; });

  // 按住已选中的家具拖动：沿地面摆放（与 2D 共用网格和贴墙吸附）。
  // 在父元素上用捕获阶段监听，赶在 OrbitControls 之前关掉它，避免同时旋转镜头
  let fdrag = null;
  host.addEventListener('pointerdown', e => {
    if (e.target !== cv || !e.isPrimary || anim || opt.mode !== 'orbit' || ui.sel?.kind !== 'furn') return;
    const h = pick(e), f = h?.fid === ui.sel.id && getF(h.fid), g = f && groundAt(e.clientX, e.clientY);
    if (!g) return;
    fdrag = {id:f.id, pid:e.pointerId, sx:e.clientX, sy:e.clientY, ox:g.x - f.cx, oy:g.y - f.cy, before:snap(), moved:false};
    orbit.enabled = false; fly = null; cv.setPointerCapture(e.pointerId);
  }, true);
  cv.addEventListener('pointermove', e => {
    if (!fdrag || e.pointerId !== fdrag.pid) return;
    if (!fdrag.moved && Math.hypot(e.clientX - fdrag.sx, e.clientY - fdrag.sy) < TAP) return;
    const f = getF(fdrag.id), g = groundAt(e.clientX, e.clientY); if (!f || !g) return;
    fdrag.moved = true; cv.style.cursor = 'grabbing';
    [f.cx, f.cy] = snapMove(f, g.x - fdrag.ox, g.y - fdrag.oy);
    furnG.children.find(o => o.userData.fid === f.id)?.position.set(wx(f.cx), 0, wz(f.cy));   // 拖动中只挪模型，松手再整体同步
  });
  const endF = e => {
    if (!fdrag || e.pointerId !== fdrag.pid) return;
    const d = fdrag; fdrag = null; orbit.enabled = true; cv.style.cursor = '';
    if (d.moved){ commit(d.before); renderAll(); }
  };
  cv.addEventListener('pointerup', endF); cv.addEventListener('pointercancel', endF);

  cv.addEventListener('pointerup', e => {
    const tap = downAt && Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]) <= TAP;
    if (look?.id === e.pointerId){
      look = null;
      if (tap){ const h = pick(e); if (h?.door && h.dist < 3.5){ h.door.open = !h.door.open; showDoorHint(h.door, e.clientX, e.clientY); } }   // 漫游时点门开关
      return;
    }
    if (anim || opt.mode !== 'orbit' || !tap) return;
    const h = pick(e);
    if (h?.door){ h.door.open = !h.door.open; showDoorHint(h.door, e.clientX, e.clientY); }
    else if (h?.fid) window.select({kind:'furn', id:h.fid});
    else if (h?.room) window.select({kind:'room', id:h.room});
    else window.select(null);
  });
  // 悬停在门上：给出开关提示（Обзор — у курсора，прогулка — в центре，см. loop）
  cv.addEventListener('pointermove', e => {
    if (!active){ showDoorHint(null); return; }
    if (opt.mode !== 'orbit') return;                 // в прогулке подсказку обновляет loop()
    if (anim){ showDoorHint(null); return; }
    const h = pick(e);
    showDoorHint(h?.door, e.clientX, e.clientY);
  });
  cv.addEventListener('pointerleave', () => showDoorHint(null));
  new ResizeObserver(() => {
    renderer.setSize(SW(), SH()); labelRenderer.setSize(SW(), SH());
    camera.aspect = SW()/SH(); camera.updateProjectionMatrix();
  }).observe(stage);
  bindUI();
}

/* ======================= 材质 ======================= */
const matCache = new Map();
let envTex = null, envK = 1;
function mat(color, o = {}){
  const key = color + JSON.stringify(o);
  if (!matCache.has(key)){
    const m = new THREE.MeshStandardMaterial({color, roughness:.7, ...o});
    // 金属 / 光滑表面挂环境反射，墙面等哑光材质不挂，避免整体变亮
    if (envTex && (m.metalness > 0 || m.roughness < .4)){ m.envMap = envTex; m.userData.env = m.metalness > .5 ? 1 : .5; m.envMapIntensity = m.userData.env*envK; }
    matCache.set(key, m);
  }
  return matCache.get(key);
}
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rgbK = (hex, k) => { const n = parseInt(hex.slice(1), 16); const f = v => Math.max(0, Math.min(255, Math.round(v*k))); return `rgb(${f(n>>16&255)},${f(n>>8&255)},${f(n&255)})`; };
// 地面贴图按真实尺寸平铺（UV 单位 = 米）
const TEX = {
  wood:{sx:1.8, sy:.36, base:'#d6b58a', rough:.55}, walnut:{sx:1.8, sy:.36, base:'#9a6f4b', rough:.5},
  tile800:{sx:.8, sy:.8, base:'#ebe6dd', grout:'#cfc6b7', rough:.3}, tile600:{sx:.6, sy:.6, base:'#dfe3e0', grout:'#bfc6c1', rough:.35},
  antislip:{sx:.3, sy:.3, base:'#d3d8d4', grout:'#aab2ac', rough:.8}, marble:{sx:1.2, sy:1.2, base:'#f2efe9', grout:'#d9d2c4', rough:.18},
  terrazzo:{sx:.5, sy:.5, base:'#e6dfd3', rough:.4}, carpet:{sx:.3, sy:.3, base:'#c6bfd2', rough:1},
};
const floorMats = {};
function floorMat(kind){
  if (floorMats[kind]) return floorMats[kind];
  const s = TEX[kind] || TEX.tile800, R = rng(kind.length*977 + 13), cv = document.createElement('canvas');
  const wood = kind === 'wood' || kind === 'walnut';
  cv.width = wood ? 1024 : 512; cv.height = wood ? 205 : 512;
  const g = cv.getContext('2d'), W = cv.width, Hh = cv.height;
  g.fillStyle = s.base; g.fillRect(0, 0, W, Hh);
  if (wood){
    const rowH = Hh/2, joints = [[W*2/3], [W/3]];
    for (let r = 0; r < 2; r++){
      let x0 = 0;
      [...joints[r], W].forEach(x1 => {
        g.fillStyle = rgbK(s.base, .9 + R()*.2); g.fillRect(x0, r*rowH, x1-x0, rowH);
        g.strokeStyle = rgbK(s.base, .8); g.globalAlpha = .35; g.lineWidth = 1.2;
        for (let k = 0; k < 7; k++){ const y = r*rowH + 6 + R()*(rowH-12); g.beginPath(); g.moveTo(x0, y);
          for (let x = x0; x <= x1; x += 40) g.lineTo(x, y + Math.sin(x*.02 + k)*2.5); g.stroke(); }
        g.globalAlpha = 1; g.fillStyle = rgbK(s.base, .62); g.fillRect(x1-1.5, r*rowH, 3, rowH); x0 = x1;
      });
      g.fillStyle = rgbK(s.base, .62); g.fillRect(0, r*rowH, W, 2.5);
    }
  } else if (kind === 'marble'){
    g.strokeStyle = 'rgba(160,150,135,.35)';

const asMat = m => typeof m === 'string' ? mat(m) : m;

function box(w, h, d, m, x = 0, y = 0, z = 0){

}
function rbox(w, h, d, m, x = 0, y = 0, z = 0, r = .04){
  const o = mesh(new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w/2-.001, h/2-.001, d/2-.001)), m); o.position.set(x, y + h/2, z); return o;

// 旋转体：pts = [[半径, 高度], …] 自下而上，y = 底面
function lathe(pts, m, x = 0, y = 0, z = 0, seg = 40){

function clearGroup(g){ g.traverse(o => { if (o.geometry) o.geometry.dispose(); }); g.clear(); }
function wallBox(seg, yb, yt, m, th){
  if (yt - yb <= .001) return null;

  const [x0, y0, x1, y1] = seg.x0 !== undefined ? [seg.x0, seg.y0, seg.x1, seg.y1] : seg, len = Math.hypot(x1-x0, y1-y0); if (len < 1) return null;

  }

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function pick(e){
  if (!e) ptr.set(0, 0);
  else { const r = renderer.domElement.getBoundingClientRect(); ptr.set((e.clientX - r.left)/r.width*2 - 1, -(e.clientY - r.top)/r.height*2 + 1); }
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects([...(opt.furn ? [furnG] : []), archUp, archFloor], true);
  let bare = null;
  for (const h of hits){
    let o = h.object;
    if (o.material === glassMat) continue;
    if (o.userData.door) return {door:o.userData.door, dist:h.distance};
    if (o.userData.room) return {room:o.userData.room};
    while (o && !o.userData.fid && o !== scene) o = o.parent;
    if (o?.userData.fid) return {fid:o.userData.fid};
    if (bare === null) bare = h;                  // первый «голый» объект: стена / торец / линтель
  }
  // дверь за торцом проёма / под притолокой: если она рядом на этом луче — считаем попаданием в дверь
  if (bare){
    const dh = hits.find(h => h.object.userData.door);
    if (dh && dh.distance - bare.distance < .5) return {door: dh.object.userData.door, dist: dh.distance};
  }
  return null;                                     // 被墙体挡住
}
// 屏幕点 → 地面（y = 0）上的户型坐标 mm；s = 该处每 mm 对应的屏幕像素，用于拖放时的幽灵图大小
const ground0 = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function groundAt(x, y){
  if (!active || anim) return null;
  const r = renderer.domElement.getBoundingClientRect(), hit = new THREE.Vector3();
  ptr.set((x - r.left)/r.width*2 - 1, -(y - r.top)/r.height*2 + 1);
  ray.setFromCamera(ptr, camera);
  if (!ray.ray.intersectPlane(ground0, hit) || hit.distanceTo(camera.position) > 60) return null;
  // 视线先碰到墙体（或飘窗台）时，落点取碰到的位置，而不是穿过墙落到看不见的墙后
  const wall = ray.intersectObjects([archUp, archFloor], true).find(h => h.object.material !== glassMat && h.object.visible && !h.object.userData.hitdoor);
  if (wall && wall.distance < hit.distanceTo(camera.position) - .01) hit.set(wall.point.x, 0, wall.point.z);
  const px = v => new THREE.Vector2(v.x*r.width/2, v.y*r.height/2), a = px(hit.clone().project(camera));
  const s = Math.max(a.distanceTo(px(hit.clone().add(new THREE.Vector3(1, 0, 0)).project(camera))),
                     a.distanceTo(px(hit.clone().add(new THREE.Vector3(0, 0, 1)).project(camera)))) / 1000;
  return {x:hit.x*1000 + OX, y:hit.z*1000 + OY, s};
}

function lookBy(dx, dy){
  eul.setFromQuaternion(camera.quaternion);
  eul.y += dx * .005; eul.x = THREE.MathUtils.clamp(eul.x + dy * .005, -1.35, 1.35);
  camera.quaternion.setFromEuler(eul);
}
function startTouchWalk(){
  touchWalk = true;
  $('#walkOverlay').style.display = 'none'; $('#joy').style.display = 'block'; $('#walkExit').style.display = 'block';
  syncHint3d();
}
function stopTouchWalk(){
  touchWalk = false; joy.x = joy.y = 0; joy.id = null; $('#joy i').style.transform = '';
  $('#joy').style.display = 'none'; $('#walkExit').style.display = 'none';
}
function bindJoystick(){
  const el = $('#joy'), knob = $('#joy i'), R = 50;
  const upd = e => {
    const r = el.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
    const L = Math.hypot(dx, dy); if (L > R){ dx *= R/L; dy *= R/L; }
    joy.x = dx/R; joy.y = dy/R; knob.style.transform = `translate(${dx}px,${dy}px)`;
  };
  el.addEventListener('pointerdown', e => { e.preventDefault(); joy.id = e.pointerId; el.setPointerCapture(e.pointerId); upd(e); });
  el.addEventListener('pointermove', e => { if (e.pointerId === joy.id) upd(e); });
  const end = e => { if (e.pointerId !== joy.id) return; joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function setMode(m){
  if (anim) return;
  opt.mode = m; syncModeBtns(); showDoorHint(null);
  if (m === 'walk'){
    window.select(null);
    if (opt.cut < H){ opt.cut = H; syncCutBtns(); sync(); }
    orbit.enabled = false; fly = null;
    camera.position.set(wx(7650), 1.6, wz(-1245)); camera.lookAt(wx(6790), 1.5, wz(-15));   // 入户门外
    $('#walkOverlay').style.display = 'flex';
    syncHint3d();
  } else {
    walkCtl.unlock(); stopTouchWalk(); orbit.enabled = true;
    $('#walkOverlay').style.display = 'none'; $('#cross').style.display = 'none';
    syncHint3d();
    orbit.target.set(0, 0, 0); flyTo(isoWhole());
  }
  showLabels(opt.labels && m === 'orbit');
  archUp.traverse(o => { if (o.userData.walkOnly) o.visible = m === 'walk'; });
}
function blocked(x, z, r = .22){
  for (const [x0, z0, x1, z1, cr] of colliders) if (distSeg(x, z, x0, z0, x1, z1) < r + (cr || .15)) return true;
  for (const d of doors){
    const a = d.pivot.rotation.y, px = d.pivot.position.x, pz = d.pivot.position.z, ex = px + Math.cos(a)*.9, ez = pz - Math.sin(a)*.9;
    const t = clamp01(((x-px)*(ex-px) + (z-pz)*(ez-pz)) / ((ex-px)**2 + (ez-pz)**2));
    if (Math.hypot(x - (px + t*(ex-px)), z - (pz + t*(ez-pz))) < r*.8) return true;
  }
  return false;
}
function stepWalk(dt){
  if (!walkCtl.isLocked && !touchWalk) return;
  const sp = (keys.ShiftLeft || keys.ShiftRight ? 2.6 : 1.4) * dt, fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
  const right = new THREE.Vector3(-fwd.z, 0, fwd.x), mv = new THREE.Vector3();
  if (keys.KeyW || keys.ArrowUp) mv.add(fwd); if (keys.KeyS || keys.ArrowDown) mv.sub(fwd);
  if (keys.KeyD || keys.ArrowRight) mv.add(right); if (keys.KeyA || keys.ArrowLeft) mv.sub(right);
  if (touchWalk){ mv.addScaledVector(fwd, -joy.y).addScaledVector(right, joy.x); }
  const mag = Math.min(1, mv.length());        // 摇杆推得越远走得越快
  if (mag < .05) return;
  mv.normalize().multiplyScalar(sp * mag);
  const p = camera.position;
  if (!blocked(p.x + mv.x, p.z)) p.x += mv.x;
  if (!blocked(p.x, p.z + mv.z)) p.z += mv.z;
}
addEventListener('keydown', e => {
  if (!active || e.target.matches('input,select,textarea')) return;
  keys[e.code] = true;
  if (e.code === 'KeyE'){
    if (opt.mode === 'walk'){
      const h = pick();
      if (h?.door && h.dist < 2.5){ h.door.open = !h.door.open; showDoorHint(h.door); }
    } else if (ui.hoverDoor){
      ui.hoverDoor.open = !ui.hoverDoor.open; showDoorHint(ui.hoverDoor, doorHintLast.x, doorHintLast.y);
    }
  }
});
addEventListener('keyup', e => keys[e.code] = false);

/* ======================= 工具栏 ======================= */
function syncModeBtns(){ document.querySelectorAll('#modes3d .btn').forEach(b => b.classList.toggle('on', b.dataset.mode === opt.mode)); }
function syncCutBtns(){ document.querySelectorAll('[data-cut]').forEach(b => b.classList.toggle('on', +b.dataset.cut === opt.cut)); }
function syncWalkTexts(){
  const t = COARSE
    ? [tr('点击开始，从入户门进入', 'Tap to start at the front door', 'Тапните, чтобы начать от входной двери'), tr('左下摇杆移动 · 在画面上拖动转向', 'Joystick moves · drag on screen to look', 'Джойстик — движение, свайп по экрану — обзор'),
       tr('点门开关 · 点「退出漫游」回到鸟瞰', 'Tap doors to open · "Exit walk" returns to orbit', 'Тап по двери открывает · «Выйти из прогулки» — назад к обзору')]
    : [tr('点击开始，从入户门进入', 'Click to start at the front door', 'Нажмите, чтобы начать от входной двери'),
       tr('<kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 移动 · 鼠标转向 · <kbd>Shift</kbd> 快走', '<kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> move · mouse looks · <kbd>Shift</kbd> runs', '<kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> — движение, мышь — обзор, <kbd>Shift</kbd> — бег'),
       tr('<kbd>E</kbd> 开关正前方的门 · <kbd>Esc</kbd> 暂停', '<kbd>E</kbd> opens the door ahead · <kbd>Esc</kbd> pauses', '<kbd>У</kbd>/<kbd>E</kbd> — дверь перед вами, <kbd>Esc</kbd> — пауза')];
  t.forEach((h, i) => $('#wo' + (i + 1)).innerHTML = h);
  syncHint3d();
}
function bindUI(){
  document.querySelectorAll('#modes3d .btn').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  // 触屏设备用摇杆漫游；桌面端锁定鼠标，锁定失败时也退回到摇杆
  $('#walkOverlay').onclick = () => COARSE ? startTouchWalk() : walkCtl.lock();
  document.addEventListener('pointerlockerror', () => { if (active && opt.mode === 'walk') startTouchWalk(); });
  $('#walkExit').onclick = () => setMode('orbit');
  bindJoystick();
  syncWalkTexts();
  $('#vIso').onclick = () => { if (opt.mode === 'walk') setMode('orbit'); else flyTo(isoWhole()); };
  $('#vTop').onclick = () => { if (opt.mode === 'walk') setMode('orbit'); flyTo(topWhole()); };
  document.querySelectorAll('[data-cut]').forEach(b => b.onclick = () => { if (opt.mode === 'walk') return; opt.cut = +b.dataset.cut; syncCutBtns(); sync(); });
  document.querySelectorAll('#toggles3d .btn').forEach(b => b.onclick = () => {
    const k = b.dataset.t; opt[k] = !opt[k]; b.classList.toggle('on', opt[k]);
    if (k === 'furn'){ furnG.visible = opt.furn; if (!opt.furn && ui.sel?.kind === 'furn') window.select(null); }
    if (k === 'labels') showLabels(opt.labels && opt.mode === 'orbit' && !anim);
    if (k === 'night') applyLight();
  });
  $('#sun').oninput = e => { opt.hour = +e.target.value; applyLight(); };
}

/* ======================= 主循环 ======================= */
const clock = new THREE.Clock();
let walkHintT = 0;
function startLoop(){ if (!raf){ clock.getDelta(); raf = requestAnimationFrame(loop); } }
function loop(){
  raf = requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05), now = performance.now();
  if (anim){ const t = clamp01((now - anim.t0)/anim.dur); anim.fn(t); if (t >= 1){ const r = anim.res; anim = null; r(); } }
  else if (fly){ const t = clamp01((now - fly.t0)/fly.dur); camTween(fly.A, fly.B, ease(t)); if (t >= 1) fly = null; }
  else if (opt.mode === 'orbit') orbit.update();
  else stepWalk(dt);
  if (active && !anim && opt.mode === 'walk' && now - walkHintT > 150){
    walkHintT = now;
    const h = pick();
    showDoorHint(h?.door && h.dist < 2.5 ? h.door : null);
  }
  doors.forEach(d => { const tg = d.open ? d.a1 : d.a0; d.cur += (tg - d.cur) * Math.min(1, dt*6); d.pivot.rotation.y = d.cur; });
  updateSel();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

function shot(){ const a = document.createElement('a'); a.download = tr('户型装修方案', 'floor-plan-design', 'floor-plan-design') + '-3D.png'; a.href = renderer.domElement.toDataURL('image/png'); a.click(); }

function relang(){ syncWalkTexts(); if (inited) buildLabels(); if (doorHintLast.door && ui.hoverDoor) showDoorHint(doorHintLast.door, doorHintLast.x, doorHintLast.y); }

window.View3D = {enter, exit, relang, sync:() => sync(), shot, groundAt, flyToRoom:id => active && !anim && flyToRoom(id), walking:() => active && opt.mode === 'walk'};
</script>
