<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fffdf9">
<title>户型装修设计</title>
<style>
:root{
  --bg:#f3efe7; --paper:#f7f4ee; --panel:#fffdf9; --line:#e3dccf; --ink:#2b2824; --muted:#8a8174;
  --accent:#b5653a; --accent-soft:#f3e3d8; --teal:#2f5d62;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) 30px;grid-template-columns:236px minmax(0,1fr) 300px;height:100vh;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 14px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;margin-right:8px;line-height:1.25}
.brand b{font-size:15px;letter-spacing:.5px}
.brand span{color:var(--muted);font-size:12px}
.grp{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}
.btn{border:0;background:transparent;padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f2ece2}
.btn.on{background:var(--ink);color:#fff}
.btn.chip.on{background:var(--accent-soft);color:var(--accent)}
#langSel .btn{min-width:32px;font-weight:500}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#9f5530}
.btn.danger{color:#b3372a}
.spacer{flex:1}
aside{background:var(--panel);overflow:auto;border-right:1px solid var(--line)}
aside.right{border-right:0;border-left:1px solid var(--line)}
.lib h4{margin:0;padding:12px 14px 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px}
.lib-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 6px}
.lib h4{position:sticky;top:0;z-index:1;background:var(--panel)}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border:1px solid var(--line);
  border-radius:8px;background:#fff;cursor:grab;user-select:none;touch-action:pan-y;transition:border-color .15s,transform .15s}
.item.dragging{border-color:var(--accent);opacity:.5}
@media (hover:hover){.item:hover{border-color:var(--accent);transform:translateY(-1px)}}
#ghost{position:fixed;left:0;top:0;z-index:30;pointer-events:none;opacity:.8;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 10px rgba(40,30,20,.3))}
#ghost svg{width:100%;height:100%;display:block;overflow:visible}
.item svg{width:56px;height:44px}
.item b{font-weight:500;font-size:12px}
.item small{color:var(--muted);font-size:11px}
.hint{padding:10px 14px 16px;color:var(--muted);font-size:12px}
main{position:relative;overflow:hidden;background:var(--paper)}
#plan{width:100%;height:100%;display:block;touch-action:none;cursor:default}
#plan.panning{cursor:grabbing}
#plan.tool-measure{cursor:crosshair}
#plan.tool-draw{cursor:crosshair}
#plan.tool-area{cursor:crosshair}
#plan.tool-door,#plan.tool-win{cursor:copy}
#plan .wall{pointer-events:none}
#plan.tool-demolish .wall{pointer-events:all;cursor:pointer}
#plan.tool-demolish .wall:hover{fill:#d9894f}
#plan.tool-select .wall{pointer-events:all;cursor:pointer}
#plan.tool-door .wall,#plan.tool-win .wall{pointer-events:all}
#plan.tool-select .wall:hover,#plan.tool-door .wall:hover,#plan.tool-win .wall:hover{filter:drop-shadow(0 0 2px rgba(181,101,58,.9))}
#plan .open{pointer-events:none}
#plan.tool-select .open{pointer-events:all;cursor:pointer}
#gBg image{pointer-events:none}
#plan.tool-select #gBg.sel image{pointer-events:all;cursor:move}
#plan.tool-select .room:hover{opacity:.82}
#plan .furn{cursor:move}
@media (hover:hover){#plan .furn:hover{filter:drop-shadow(0 0 2px rgba(181,101,58,.7))}}
[data-handle]{cursor:pointer}
[data-handle=size]{cursor:nwse-resize}
.scalebar{position:absolute;left:14px;bottom:12px;background:rgba(255,253,249,.92);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:12px;pointer-events:none}
.scalebar .bar{height:6px;border:1.5px solid var(--ink);border-top:0;margin-top:3px}
.modehint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:5px 12px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.modehint.show{opacity:.9}
footer{grid-column:1/-1;display:flex;gap:18px;align-items:center;padding:0 14px;background:var(--panel);overflow:hidden;white-space:nowrap;
  border-top:1px solid var(--line);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#tip{overflow:hidden;text-overflow:ellipsis}
footer b{color:var(--ink);font-weight:500}
#panel section{padding:12px 16px;border-bottom:1px solid var(--line)}
#panel h3{margin:0 0 8px;font-size:13px}
#panel h3 small{color:var(--muted);font-weight:400;margin-left:6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:4px 2px;border-bottom:1px dashed #eee6d9}
td.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:#faf5ee}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15);vertical-align:-2px;margin-right:6px}
.total{display:flex;justify-content:space-between;margin-top:8px;font-size:14px}
.total b{color:var(--accent)}
.muted{color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form label.full{grid-column:1/-1}
.form input,.form select{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;width:100%}
.form input[type=color]{padding:2px;height:30px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.actions .btn{border:1px solid var(--line);background:#fff}
#wTypes .btn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);opacity:1}
#wTypes .btn:disabled{opacity:1;cursor:default}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mat{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;cursor:pointer;text-align:left}
.mat.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mat i{width:26px;height:26px;border-radius:5px;border:1px solid rgba(0,0,0,.12);flex:none}
.mat span{font-size:12px;line-height:1.3}
.mat small{display:block;color:var(--muted)}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;color:var(--muted)}
kbd{font:11px ui-monospace,Menlo,monospace;background:#f2ece2;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink)}
.big{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.stats div{background:#faf6ef;border-radius:8px;padding:8px}
.stats small{display:block;color:var(--muted);font-size:11px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:8px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:10}
#toast.show{opacity:1;transform:translateX(-50%)}
/* ---------- 2D / 3D 切换 ---------- */
.seg{position:relative;padding:3px}
.seg .btn{position:relative;z-index:1;width:82px;transition:color .45s}
.seg .btn:hover{background:transparent}
.seg .pill{position:absolute;left:3px;top:3px;bottom:3px;width:82px;border-radius:6px;background:var(--accent);
  box-shadow:0 2px 6px rgba(181,101,58,.35);transition:transform .5s cubic-bezier(.65,0,.35,1)}
.seg .btn[data-view="2d"],body.m3d .seg .btn[data-view="3d"]{color:#fff}
body.m3d .seg .btn[data-view="2d"]{color:var(--ink)}
body.m3d .seg .pill{transform:translateX(84px)}
body.busy .seg{pointer-events:none}
body.m3d .only2d,body:not(.m3d) .only3d{display:none!important}
.only2d,.only3d{animation:fadeIn .45s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#plan{transition:opacity .45s ease,transform .45s ease}
main.is3d #plan{opacity:0;pointer-events:none}
.scalebar{transition:opacity .3s}
main.is3d .scalebar{opacity:0}
#view3d{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
main.is3d #view3d{opacity:1;visibility:visible;transition:opacity .45s ease}
#view3d canvas{display:block;outline:none}
#walkOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,28,25,.35);z-index:3;cursor:pointer}
#walkOverlay>div{background:var(--panel);border-radius:14px;padding:22px 28px;text-align:center;max-width:360px}
#walkOverlay h3{margin:0 0 6px}
#walkOverlay p{margin:4px 0;color:var(--muted)}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;z-index:2;display:none;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:6px;top:0;width:2px;height:14px}#cross:after{top:6px;left:0;height:2px;width:14px}
#hint3d{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(43,40,36,.82);color:#fff;border-radius:20px;
  padding:5px 14px;font-size:12px;z-index:2;pointer-events:none;white-space:nowrap;transition:opacity .4s}
main.animating #hint3d{opacity:0}
#doorHint{position:absolute;left:0;top:0;background:rgba(43,40,36,.92);color:#fff;border-radius:10px;padding:5px 13px;
  font-size:12px;z-index:2;pointer-events:none;white-space:nowrap;display:none;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#doorHint b{display:inline-block;border:1px solid rgba(255,255,255,.55);border-radius:4px;padding:0 5px;margin:0 2px;font-weight:600}
.rlabel{font-size:12px;font-weight:600;color:#2b2824;background:rgba(255,253,249,.9);border:1px solid var(--line);
  border-radius:12px;padding:2px 9px;white-space:nowrap;pointer-events:none}
.rlabel small{font-weight:400;color:var(--muted);margin-left:4px}
#roomList{padding:0 10px 6px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
#roomList button{display:flex;flex-direction:column;width:100%;border:1px solid var(--line);background:#fff;padding:5px 8px;border-radius:7px;cursor:pointer;text-align:left;line-height:1.3}
#roomList button:hover{background:#f2ece2}
#roomList button.on{background:var(--accent-soft);color:var(--accent)}
#roomList small{color:var(--muted);font-variant-numeric:tabular-nums}
.range{display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--muted);font-size:12px}
.range input{width:100px;accent-color:var(--accent)}
.menu{position:relative}
.menu summary{list-style:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px}
.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:fixed;display:flex;flex-direction:column;min-width:150px;background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 10px 30px rgba(40,30,20,.14);z-index:60;animation:fadeIn .2s ease}
.menu-pop .btn{text-align:left}
.range span{font-variant-numeric:tabular-nums;color:var(--ink)}
/* ---------- 选中后的浮动工具条 ---------- */
#fab{position:absolute;left:50%;bottom:16px;transform:translate(-50%,12px);display:flex;align-items:center;gap:4px;padding:5px;
  background:rgba(255,253,249,.97);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 26px rgba(40,30,20,.16);
  z-index:4;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s linear .2s;max-width:calc(100% - 24px)}
main.drawer-panel #fab{opacity:0;visibility:hidden}
#fab.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .2s,transform .2s}
#fab .name{padding:0 8px 0 6px;font-weight:600;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fab .btn{border:1px solid transparent}
#fab .sep{width:1px;align-self:stretch;margin:4px 2px;background:var(--line)}
/* ---------- 触屏漫游摇杆 ---------- */
#joy{position:absolute;left:28px;bottom:28px;width:130px;height:130px;border-radius:50%;background:rgba(255,253,249,.25);
  border:2px solid rgba(255,255,255,.7);box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:3;display:none;touch-action:none;backdrop-filter:blur(3px)}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,253,249,.92);
  box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
#walkExit{position:absolute;right:16px;bottom:28px;z-index:3;display:none}
/* ---------- 触屏：加大点击区域 ---------- */
@media (pointer:coarse){
  body{font-size:14px}
  header{padding:8px 12px;gap:8px}
  .grp{padding:3px;border-radius:10px}
  .btn{padding:8px 12px;min-height:38px;border-radius:8px}
  .seg .btn,.seg .pill{width:92px}
  body.m3d .seg .pill{transform:translateX(94px)}
  .menu summary{padding:9px 14px}
  .menu-pop .btn{padding:11px 14px}
  .item{padding:10px 4px 8px}
  .form input,.form select{font-size:16px;padding:8px 9px}
  .form input[type=color]{height:40px}
  .actions .btn,#fab .btn{min-height:42px;padding:9px 14px}
  td{padding:7px 2px}
  #roomList button{padding:8px 10px}
  .mat{padding:9px 8px}
  .range input{width:120px!important}
}
/* ---------- 竖屏 / 窄屏（如 iPad 竖握）：侧栏改为抽屉 ---------- */
/* ---------- 宽屏：左右面板可收起 ---------- */
@media (min-width:1101px){
  .app{transition:grid-template-columns .3s cubic-bezier(.3,.7,.3,1)}
  .app.hide-lib{grid-template-columns:0 minmax(0,1fr) 300px}
  .app.hide-panel{grid-template-columns:236px minmax(0,1fr) 0}
  .app.hide-lib.hide-panel{grid-template-columns:0 minmax(0,1fr) 0}
  .app.hide-lib aside.lib,.app.hide-panel aside.right{overflow:hidden;border:0}
  aside{overflow-x:hidden}
  aside.lib>div{min-width:220px} #panel{min-width:284px}   /* 收起动画中内容不被挤压变形 */
}
.narrow-only{display:none!important}
@media (max-width:1100px){
  .grp.narrow-only{display:flex!important}
  .btn.narrow-only,#fab .btn.narrow-only{display:inline-block!important}
  .app{grid-template-columns:minmax(0,1fr)}
  main,aside.lib,aside.right{grid-row:2;grid-column:1}
  aside.lib,aside.right{position:relative;z-index:6;width:min(320px,86vw);transition:transform .3s cubic-bezier(.3,.7,.3,1),box-shadow .3s}
  aside.lib{justify-self:start;transform:translateX(-110%)}
  aside.right{justify-self:end;transform:translateX(110%)}
  aside.open{transform:none;box-shadow:0 0 30px rgba(40,30,20,.18)}
  .lib-grid{grid-template-columns:1fr 1fr 1fr}
  .brand span,footer .only2d{display:none!important}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div class="app">
  <header>
    <div class="grp" id="paneBtns">
      <button class="btn chip" id="tgLib" data-en="◧ Library" data-ru="◧ Мебель">◧ 家具库</button>
      <button class="btn chip" id="tgPanel" data-en="Properties ◨" data-ru="Свойства ◨">属性 ◨</button>
    </div>
    <div class="brand"><b data-en="3BR 2LR 2BA · Interior Design" data-ru="2-комн. Планировка">三室两厅两卫 · 装修设计</b><span id="subtitle">План 1:60 · ед. изм. мм</span></div>
    <div class="grp seg" id="viewSeg" title="Переключение 2D / 3D (T)" data-en-title="Switch 2D / 3D (T)" data-ru-title="Переключение 2D / 3D (T)">
      <span class="pill"></span>
      <button class="btn" data-view="2d" data-en="2D Plan" data-ru="2D план">2D 平面</button>
      <button class="btn" data-view="3d" data-en="3D Scene" data-ru="3D сцена">3D 场景</button>
    </div>
    <div class="grp only2d" id="tools">
      <button class="btn on" data-tool="select" title="选择 / 移动 (V)" data-en-title="Select / Move (V)" data-ru-title="Выбор / перемещение (V)" data-en="Select" data-ru="Выбор">选择</button>
      <button class="btn" data-tool="draw" title="Рисовать стену (W)" data-en-title="Draw wall (W)" data-ru-title="Рисовать стену (W)" data-en="Wall" data-ru="Стена">墙</button>
      <button class="btn" data-tool="door" title="Поставить дверь (D)" data-en-title="Place door (D)" data-ru-title="Поставить дверь (D)" data-en="Door" data-ru="Дверь">门</button>
      <button class="btn" data-tool="win" title="Поставить окно (N)" data-en-title="Place window (N)" data-ru-title="Поставить окно (N)" data-en="Window" data-ru="Окно">窗</button>
      <button class="btn" data-tool="line" title="Пунктирная линия (L)" data-en-title="Dashed line (L)" data-ru-title="Пунктирная линия (L)" data-en="Line" data-ru="Линия">线</button>
      <button class="btn" data-tool="measure" title="测量 (M)" data-en-title="Measure (M)" data-ru-title="Замер (M)" data-en="Measure" data-ru="Замер">测量</button>
      <button class="btn" data-tool="demolish" title="拆改非承重墙 (X)" data-en-title="Demolish non-bearing walls (X)" data-ru-title="Снос стены (X)" data-en="Demolish" data-ru="Снос">拆改墙体</button>
      <button class="btn" data-tool="area" title="Область — рамочное выделение (A)" data-en-title="Area — marquee select (A)" data-ru-title="Область — рамочное выделение (A)" data-en="Area" data-ru="Область">Область</button>
    </div>
    <div class="grp only2d" id="wallKSeg" data-ru-title="Тип новой стены" data-en-title="New wall type" title="Тип новой стены">
      <button class="btn chip" data-wk="b" data-ru-title="Несущая стена 300 мм" data-en-title="Bearing wall 300 mm" title="Несущая стена 300 мм" data-en="Bearing" data-ru="Несущая">承重</button>
      <button class="btn chip on" data-wk="n" data-ru-title="Ненесущая перегородка 150 мм" data-en-title="Non-bearing partition 150 mm" title="Ненесущая перегородка 150 мм" data-en="Partition" data-ru="Перегородка">隔墙</button>
      <button class="btn chip" data-wk="low" data-ru-title="Низкая стенка 100 мм" data-en-title="Low wall 100 mm" title="Низкая стенка 100 мм" data-en="Low" data-ru="Низкая">矮墙</button>
    </div>
    <div class="grp only2d" id="lenSeg" style="display:none" data-ru-title="Размер проёма" data-en-title="Opening size" title="Размер проёма"></div>
    <div class="grp only2d">
      <button class="btn" id="zoomOut" title="Отдалить" data-en-title="Zoom out" data-ru-title="Отдалить">−</button>
      <button class="btn" id="zoomIn" title="Приблизить" data-en-title="Zoom in" data-ru-title="Приблизить">＋</button>
      <button class="btn" id="fit" title="Вписать в окно (F)" data-en-title="Fit to window (F)" data-ru-title="Вписать в окно (F)" data-en="Fit" data-ru="Вписать">适应</button>

const unitK = () => UNITS === 'cm' ? 10 : UNITS === 'm' ? 1000 : 1;
const US = () => ({mm:tr('мм','mm','мм'), cm:tr('см','cm','см'), m:tr('м','m','м')})[UNITS];
const fmtN = mm => { const v = mm / unitK(); return UNITS === 'mm' ? String(Math.round(v)) : String(+v.toFixed(UNITS === 'cm' ? 1 : 2)); };
const fmtL = mm => fmtN(mm) + ' ' + US();
function setUnits(u){
  if (!['mm','cm','m'].includes(u)) return;
  UNITS = u; try { localStorage.setItem(UNITS_KEY, u); } catch(e) {}

}

function defaultState(){

  return {
    furniture: defaultFurniture(),

const STORE = 'hata-flat-v4';
function load(){
  try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && Array.isArray(s.furniture) && Array.isArray(s.walls)) return fixState(s); } catch(e) {}
  return null;
}
function fixState(s){
  const d = defaultState();
  s.rooms = Object.assign(d.rooms, s.rooms || {});
  s.demolished = s.demolished || []; s.measures = s.measures || [];
  s.lines = Array.isArray(s.lines) ? s.lines : [];
  s.walls = Array.isArray(s.walls) && s.walls.length ? s.walls : d.walls;
  s.wins = Array.isArray(s.wins) ? s.wins : d.wins;
  s.doors = Array.isArray(s.doors) ? s.doors : d.doors;
  // миграция: 3 типа стен (b / n / low) + явная толщина th; старые виды сохраняем толщиной
  const K2 = {b4:'b', m:'n', xl:'n', e:'b'};
  const normK = (x, def) => { if (x.th == null) x.th = WTH[x.k] || def; x.k = K2[x.k] || x.k; if (!['b','n','low'].includes(x.k)) x.k = 'n'; };
  s.walls.forEach(w => normK(w, 150));
  s.wins.forEach(w => normK(w, 300));
  s.bg = (s.bg && typeof s.bg.src === 'string' && s.bg.w > 0 && s.bg.h > 0) ? s.bg : null;
  if (s.bg && !(s.bg.ar > 0)) s.bg.ar = s.bg.w / s.bg.h;
  return s;
}

function validateSel(){
  if (ui.sel?.kind==='furn' && !getF(ui.sel.id)) ui.sel = null;
  if (ui.sel?.kind==='lamp' && !getLamp(ui.sel.id)) ui.sel = null;
  if (ui.sel?.kind==='bg' && !state.bg) ui.sel = null;
  if (ui.sel?.kind==='line' && !(state.lines || []).find(l => l.id === ui.sel.id)) ui.sel = null;
  if (ui.sel?.kind==='multi'){
    const keep = (ui.sel.items || []).filter(it => {
      if (it.kind==='wall') return !!getWall(it.id);
      if (it.kind==='furn') return !!getF(it.id);
      if (it.kind==='lamp') return !!getLamp(it.id);
      if (it.kind==='line') return (state.lines || []).some(l => l.id === it.id);
      if (it.kind==='open') return it.sub==='door' ? !!DOORS.find(d => d.id===it.id) : !!WINS.find(w => w.id===it.id);
      return false;
    });
    ui.sel = keep.length ? {kind:'multi', items:keep} : null;
  }
  if (ui.sel?.kind==='wall' && !WALLS.find(w => w.id === ui.sel.id)) ui.sel = null;
  if (ui.sel?.kind==='open'){
    const s = ui.sel;
    if (s.sub==='door' && !DOORS.find(d => d.id === s.id)) ui.sel = null;
    if (s.sub==='win' && !WINS.find(w => w.id === s.id)) ui.sel = null;
  }
}

/* ======================= 几何工具 ======================= */
const area = poly => Math.abs(poly.reduce((a,p,i) => { const q = poly[(i+1)%poly.length]; return a + p[0]*q[1] - q[0]*p[1]; }, 0)) / 2 / 1e6;
const perim = poly => poly.reduce((a,p,i) => { const q = poly[(i+1)%poly.length]; return a + Math.hypot(q[0]-p[0], q[1]-p[1]); }, 0) / 1000;
const bbox = poly => { const xs = poly.map(p=>p[0]), ys = poly.map(p=>p[1]); return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]; };
function aabb(f){ const a = f.rot*Math.PI/180, c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a)); return {hw:f.w/2*c + f.d/2*s, hh:f.w/2*s + f.d/2*c}; }
/* Геометрия для рамочного выделения */
function segInt(ax,ay,bx,by,cx,cy,dx,dy){
  const d1x = bx-ax, d1y = by-ay, d2x = dx-cx, d2y = dy-cy;
  const den = d1x*d2y - d1y*d2x; if (Math.abs(den) < 1e-9) return false;
  const t = ((cx-ax)*d2y - (cy-ay)*d2x)/den, u = ((cx-ax)*d1y - (cy-ay)*d1x)/den;
  return t >= 0 && t <= 1 && u >= 0 && u <= 1;
}
function ptInRect(x,y,r){ return x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1; }
function segRectHit(ax,ay,bx,by,r){
  if (ptInRect(ax,ay,r) || ptInRect(bx,by,r)) return true;
  return segInt(ax,ay,bx,by, r.x0,r.y0,r.x1,r.y0)
      || segInt(ax,ay,bx,by, r.x1,r.y0,r.x1,r.y1)
      || segInt(ax,ay,bx,by, r.x1,r.y1,r.x0,r.y1)
      || segInt(ax,ay,bx,by, r.x0,r.y1,r.x0,r.y0);
}
function rectsOverlap(a,b){ return a.x0 <= b.x1 && a.x1 >= b.x0 && a.y0 <= b.y1 && a.y1 >= b.y0; }
const fmt = (n, d=2) => n.toFixed(d);
const norm = a => ((Math.round(a) % 360) + 360) % 360;
// —— 线段墙工具（w = {id,x0,y0,x1,y1,k}） ——
const segLen = w => Math.hypot(w.x1-w.x0, w.y1-w.y0);
function wallQuad(w){
  const th = wallTh(w), L = segLen(w) || 1;
  const nx = -(w.y1-w.y0)/L*th/2, ny = (w.x1-w.x0)/L*th/2;
  return [[w.x0+nx,w.y0+ny],[w.x1+nx,w.y1+ny],[w.x1-nx,w.y1-ny],[w.x0-nx,w.y0-ny]];
}
const polyStr = p => p.map(q => q[0] + ',' + q[1]).join(' ');
function distSeg(px, py, x0, y0, x1, y1){
  const dx = x1-x0, dy = y1-y0, L2 = dx*dx + dy*dy;
  let t = L2 ? ((px-x0)*dx + (py-y0)*dy)/L2 : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x0 + t*dx), py - (y0 + t*dy));
}
function snapSegs(){ return WALLS.filter(w => !state.demolished.includes(w.id)).concat(WINS); }
function pointInPoly(pt, poly){
  let c = false;
  for (let i = 0, j = poly.length-1; i < poly.length; j = i++)
    if (((poly[i][1] > pt[1]) !== (poly[j][1] > pt[1])) &&
        (pt[0] < (poly[j][0]-poly[i][0]) * (pt[1]-poly[i][1]) / (poly[j][1]-poly[i][1]) + poly[i][0])) c = !c;
  return c;
}
const centroid = poly => [poly.reduce((a,p)=>a+p[0],0)/poly.length, poly.reduce((a,p)=>a+p[1],0)/poly.length];

/* —— Автоподсчёт комнат: грани планарного графа из стен —— */
function detectFaces(){
  // 1. активные стены + виртуальные границы комнат (без стены — кухня-ниша)
  const raw = [];
  WALLS.forEach(w => { if (!state.demolished.includes(w.id)) raw.push([w.x0,w.y0,w.x1,w.y1,wallTh(w)]); });
  raw.push([936,2306,4404,2306,'v']);                  // кухня | жилая 1 (виртуально)
  raw.push([4697,2344,4697,4143,'v']);                 // жилая 1 | коридор (виртуально)
  raw.push([7059,2344,7059,3685,'v']);                 // коридор | прихожая (виртуально)
  (state.lines || []).forEach(l => raw.push([l.x0,l.y0,l.x1,l.y1,'v']));   // расчётные линии (без толщины)
  const opens = [];
  DOORS.forEach(d => opens.push([d.a[0],d.a[1],d.b[0],d.b[1], d.wt || 150]));
  WINS.forEach(w => opens.push([w.x0,w.y0,w.x1,w.y1, w.th ?? WTH[w.k] ?? 300]));
  if (raw.length < 3) return [];
  // 2. удлинение стен до ближайших пересечений линий (зазоры в углах чертежа)
  const EXT = 600;
  const lens = raw.map(s => Math.hypot(s[2]-s[0], s[3]-s[1]) || 1);
  const range = raw.map(() => [0, 1]);
  const lineInt = (a, b) => {
    const d = (a[2]-a[0])*(b[3]-b[1]) - (a[3]-a[1])*(b[2]-b[0]);
    if (Math.abs(d) < 1e-9) return null;
    const t = ((b[0]-a[0])*(b[3]-b[1]) - (b[1]-a[1])*(b[2]-b[0])) / d;
    const u = ((b[0]-a[0])*(a[3]-a[1]) - (b[1]-a[1])*(a[2]-a[0])) / d;
    return [t, u];
  };
  for (let i=0; i<raw.length; i++) for (let j=i+1; j<raw.length; j++){
    const I = lineInt(raw[i], raw[j]); if (!I) continue;
    const [t, u] = I, li = EXT/lens[i], lj = EXT/lens[j];
    if (t >= -li && t <= 1+li && u >= -lj && u <= 1+lj){
      if (t < range[i][0]) range[i][0] = t; if (t > range[i][1]) range[i][1] = t;
      if (u < range[j][0]) range[j][0] = u; if (u > range[j][1]) range[j][1] = u;
    }
  }
  const extSegs = raw.map((s, i) => {
    const [t0, t1] = range[i];
    return [s[0]+(s[2]-s[0])*t0, s[1]+(s[3]-s[1])*t0, s[0]+(s[2]-s[0])*t1, s[1]+(s[3]-s[1])*t1, s[4]];
  });
  const cuts = extSegs.map(() => new Set([0, 1]));
  const tOnSeg = (px,py,x0,y0,x1,y1) => {
    const dx=x1-x0, dy=y1-y0, L2=dx*dx+dy*dy; if (L2 < 1) return null;
    const t=((px-x0)*dx+(py-y0)*dy)/L2;
    if (t <= 1e-9 || t >= 1-1e-9) return null;
    return Math.hypot(px-(x0+t*dx), py-(y0+t*dy)) <= 3 ? t : null;
  };
  const segInt = (a,b) => {
    const [x1,y1,x2,y2]=a, [x3,y3,x4,y4]=b;
    const d=(x2-x1)*(y4-y3)-(y2-y1)*(x4-x3); if (Math.abs(d) < 1e-9) return null;
    const t=((x3-x1)*(y4-y3)-(y3-y1)*(x4-x3))/d, u=((x3-x1)*(y2-y1)-(y3-y1)*(x2-x1))/d;
    if (t < -1e-9 || t > 1+1e-9 || u < -1e-9 || u > 1+1e-9) return null;
    return [t,u];
  };
  for (let i=0; i<extSegs.length; i++) for (let j=i+1; j<extSegs.length; j++){
    const I = segInt(extSegs[i],extSegs[j]);
    if (I){ cuts[i].add(I[0]); cuts[j].add(I[1]); }
    [[extSegs[i][0],extSegs[i][1]],[extSegs[i][2],extSegs[i][3]]].forEach(p => { const t=tOnSeg(p[0],p[1],...extSegs[j]); if (t!=null) cuts[j].add(t); });
    [[extSegs[j][0],extSegs[j][1]],[extSegs[j][2],extSegs[j][3]]].forEach(p => { const t=tOnSeg(p[0],p[1],...extSegs[i]); if (t!=null) cuts[i].add(t); });
  }
  // 3. проёмы/виртуальные связи проецируются на осевые линии стен (полутолщины, зазоры)
  const openSegs = opens.map(([x0,y0,x1,y1,th]) => {
    const snapPt = (px,py) => {
      let bd = 300, bq = null;
      for (let i=0; i<extSegs.length; i++){
        const [sx0,sy0,sx1,sy1] = extSegs[i];
        const dx=sx1-sx0, dy=sy1-sy0, L2=dx*dx+dy*dy; if (L2 < 1) continue;
        const t=((px-sx0)*dx+(py-sy0)*dy)/L2;
        let qx, qy, tc;
        if (t >= 0 && t <= 1){ qx = sx0+t*dx; qy = sy0+t*dy; tc = t; }
        else {                                          // за пределами — ближайший конец сегмента
          const e = t < 0 ? [sx0,sy0,0] : [sx1,sy1,1];
          qx = e[0]; qy = e[1]; tc = e[2];
        }
        const d = Math.hypot(qx-px, qy-py);
        if (d < bd){ bd = d; bq = [qx,qy,i,tc]; }
      }
      if (bq){
        if (bq[3] > 1e-9 && bq[3] < 1-1e-9) cuts[bq[2]].add(bq[3]);
        const ew = extSegs[bq[2]][4];
        return [bq[0], bq[1], typeof ew === 'number' ? ew : (WTH[ew] || th)];
      }
      return [px, py, th];
    };
    const a = snapPt(x0,y0), b = snapPt(x1,y1);
    return [a[0],a[1],b[0],b[1], Math.max(a[2], b[2])];
  });
  // 4. узлы + рёбра (с толщиной стены ребра — для инсета площади)
  const nodeList = [];
  const nodeOf = (x,y) => {
    for (let i=0; i<nodeList.length; i++) if (Math.hypot(nodeList[i][0]-x, nodeList[i][1]-y) < 8) return i;
    nodeList.push([x,y]); return nodeList.length-1;
  };
  const edgeSet = new Map(), edges = [];
  const pushEdge = (x0,y0,x1,y1,th) => {
    const a = nodeOf(x0,y0), b = nodeOf(x1,y1);
    if (a === b) return;
    const key = a < b ? a+'_'+b : b+'_'+a;
    if (!edgeSet.has(key)){ edgeSet.set(key, th); edges.push([a,b]); }
  };
  extSegs.forEach((s,i) => {
    const ts = [...cuts[i]].sort((a,b)=>a-b);
    const th = typeof s[4] === 'number' ? s[4] : (WTH[s[4]] || 150);
    for (let k=0; k<ts.length-1; k++){
      const t0=ts[k], t1=ts[k+1]; if (t1-t0 < 1e-6) continue;
      pushEdge(s[0]+(s[2]-s[0])*t0, s[1]+(s[3]-s[1])*t0, s[0]+(s[2]-s[0])*t1, s[1]+(s[3]-s[1])*t1, s[4]==='v' ? 0 : th);
    }
  });
  openSegs.forEach(([x0,y0,x1,y1,th]) => {        // проём режется в узлах, лежащих на нём (иначе коллинеарный дубль ломает грани)
    const hits = [];
    for (let i=0;i<nodeList.length;i++){
      const px=nodeList[i][0], py=nodeList[i][1];
      const dx=x1-x0, dy=y1-y0, L2=dx*dx+dy*dy; if (L2 < 1) continue;
      const t=((px-x0)*dx+(py-y0)*dy)/L2;
      if (t <= 1e-9 || t >= 1-1e-9) continue;
      if (Math.hypot(px-(x0+t*dx), py-(y0+t*dy)) <= 30) hits.push([t,i]);
    }
    hits.sort((a,b)=>a[0]-b[0]);
    let ax=x0, ay=y0;
    for (const [,i] of hits){
      pushEdge(ax,ay,nodeList[i][0],nodeList[i][1],th);
      ax=nodeList[i][0]; ay=nodeList[i][1];
    }
    pushEdge(ax,ay,x1,y1,th);
  });
  if (edges.length < 3) return [];
  const adj = nodeList.map(() => []);
  edges.forEach(([a,b]) => { adj[a].push(b); adj[b].push(a); });
  const sortedNb = adj.map((l,u) => [...new Set(l)].map(v => [v, Math.atan2(nodeList[v][1]-nodeList[u][1], nodeList[v][0]-nodeList[u][0])])
    .sort((a,b) => a[1]-b[1]).map(x => x[0]));
  const visited = new Set(), faces = [];
  for (let u0=0; u0<nodeList.length; u0++){
    for (const v0 of sortedNb[u0]){
      if (visited.has(u0+'>'+v0)) continue;
      const loop = [];
      let u = u0, v = v0, guard = 0;
      while (guard++ < 20000){
        if (visited.has(u+'>'+v)) break;
        visited.add(u+'>'+v); loop.push(u);
        const nb = sortedNb[v], iu = nb.indexOf(u);
        if (iu < 0) break;
        const w = nb[(iu - 1 + nb.length) % nb.length];
        u = v; v = w;
        if (u === u0 && v === v0) break;
      }
      if (loop.length >= 3){
        const clean = removeSpurs(loop);
        if (clean.length >= 3){
          const poly = clean.map(i => nodeList[i]);
          const a = Math.abs(poly.reduce((s,p,i) => { const q=poly[(i+1)%poly.length]; return s + p[0]*q[1]-q[0]*p[1]; },0)/2);
          if (a > 0.7e6 && a < 500e6) faces.push({loop:clean, poly, a});
        }
      }
    }
  }
  if (!faces.length) return [];
  faces.sort((x,y) => y.a - x.a);
  const outerC = faces.filter((f,i) => i > 0 && pointInPoly(centroid(f.poly), faces[0].poly));
  if (outerC.length === faces.length-1) faces.shift();
  // 5. возвращаем осевые полигоны + толщины рёбер (для нетто-площади)
  return faces.map(f => ({
    poly: f.poly,
    ths: f.loop.map((u,i) => {
      const v = f.loop[(i+1)%f.loop.length];
      return edgeSet.get(u < v ? u+'_'+v : v+'_'+u) || 0;
    }),
  }));
}
// вырезаем «шпоры»: палиндромные туда-обратно выступы (A,B,A / A,B,C,B,A)
function removeSpurs(loop){
  let L = loop.slice();
  let changed = true;
  while (changed && L.length >= 3){
    changed = false;
    outer:
    for (let i=0; i<L.length; i++){
      for (let j=i+2; j<L.length; j++){
        if (L[j] !== L[i]) continue;
        let pal = true;
        for (let m=1; i+m < j-m; m++) if (L[i+m] !== L[j-m]){ pal = false; break; }
        if (pal){
          L.splice(i+1, j-i);
          changed = true;
          break outer;
        }
      }
    }
  }
  const out = [];
  L.forEach(n => { if (out.length && out[out.length-1] === n) return; out.push(n); });
  if (out.length > 1 && out[0] === out[out.length-1]) out.pop();
  return out;
}
/* Нетто-площадь: осевой полигон − полосы полутолщин по рёбрам + угловые поправки.
 * A = A0 − Σ len·th/2 + Σ (th_a/2·th_b/2)/sinφ  (φ — поворот между ребрами, обход с интерьером справа) */
function netArea(poly, ths){
  if (poly.length < 3) return area(poly);
  let A = Math.abs(poly.reduce((s,p,i) => { const q = poly[(i+1)%poly.length]; return s + p[0]*q[1] - q[0]*p[1]; }, 0)) / 2;
  let strip = 0;
  for (let i=0; i<poly.length; i++){
    const p = poly[i], q = poly[(i+1)%poly.length];
    strip += Math.hypot(q[0]-p[0], q[1]-p[1]) * (ths[i] || 0) / 2;
  }
  let corr = 0;
  for (let i=0; i<poly.length; i++){
    const prev = poly[(i-1+poly.length)%poly.length], v = poly[i], next = poly[(i+1)%poly.length];
    const ua = [v[0]-prev[0], v[1]-prev[1]], wb = [next[0]-v[0], next[1]-v[1]];
    const la = Math.hypot(ua[0],ua[1]) || 1, lb = Math.hypot(wb[0],wb[1]) || 1;
    const cross = (ua[0]/la)*(wb[1]/lb) - (ua[1]/la)*(wb[0]/lb);
    const da = (ths[(i-1+poly.length)%poly.length] || 0) / 2, db = (ths[i] || 0) / 2;
    if (da && db && Math.abs(cross) > 0.05) corr += da * db / cross;
  }
  return Math.max(0, A - strip + corr) / 1e6;
}

function rebuildRooms(){
  let faces = [];
  try { faces = detectFaces(); } catch(e){ console.warn('detectFaces', e); }
  faces.sort((x,y) => { const ca=centroid(x.poly), cb=centroid(y.poly); return ca[1]-cb[1] || ca[0]-cb[0]; });
  const rooms = [];
  faces.forEach((f, i) => {
    const poly = f.poly;
    let ths = f.ths;
    const meta = DEFAULT_ROOMS.find(r => pointInPoly(r.at, poly));
    if (meta && meta.takeFull){
      // по чертежу эти перегородки целиком входят в площадь комнаты:
      // граница сдвигается на дальнюю грань стены (отрицательная полутолщина)
      ths = ths.map((th, k) => {
        if (th <= 0) return th;
        const p = poly[k], q = poly[(k+1)%poly.length];
        if (Math.abs(p[1]-q[1]) < 1 && meta.takeFull.some(y => Math.abs(y-p[1]) <= 1)) return -th;
        return th;
      });
    }
    const a = netArea(poly, ths);
    const c = centroid(poly);
    const id = meta ? meta.id : 'auto' + i;
    const saved = state.rooms[id];
    rooms.push({
      id, poly, area: a,
      name: (saved && saved.name) || (meta && meta.name) || `Комната ${i+1}`,
      mat: (saved && saved.mat) || (meta && meta.mat) || (a < 7 ? 'tile600' : 'wood'),
      at: (meta && meta.at) || (saved && saved.at) || c,
    });
    if (!state.rooms[id]) state.rooms[id] = {name:rooms.at(-1).name, mat:rooms.at(-1).mat, at:rooms.at(-1).at};
  });
  ROOMS = rooms;
  if (!Array.isArray(state.lamps))                // разовая миграция: по одной лампе на комнату
    state.lamps = rooms.filter(r => r.at).map(r => ({id: uid(), x: Math.round(r.at[0]), y: Math.round(r.at[1])}));
}
function rArea(r){
  return (r && typeof r.area === 'number') ? r.area : area(r.poly || []);
}

function hex2rgb(h){ h = h.replace('#',''); if (h.length===3) h = h.split('').map(c=>c+c).join(''); const n = parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function shade(h,k){ const f = v => Math.max(0,Math.min(255,Math.round(k>1 ? v+(255-v)*(k-1)*2 : v*k))); return '#'+hex2rgb(h).map(v=>f(v).toString(16).padStart(2,'0')).join(''); }

/* ======================= 家具图例 ======================= */
const ST = 'stroke="#3d3a34" stroke-width="1" vector-effect="non-scaling-stroke"';
const rc = (x,y,w,h,f,ex='') => `<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${Math.max(0,h)}" fill="${f}" ${ST} ${ex}/>`;
const ec = (cx,cy,rx,ry,f,ex='') => `<ellipse cx="${cx}" cy="${cy}" rx="${Math.max(0,rx)}" ry="${Math.max(0,ry)}" fill="${f}" ${ST} ${ex}/>`;
const ln = (x1,y1,x2,y2,ex='') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${ST} ${ex}/>`;
const pa = (d,f='none',ex='') => `<path d="${d}" fill="${f}" ${ST} ${ex}/>`;
const DASH = 'stroke-dasharray="4 3"';

function furnSVG(t,w,d,c){
  const x = -w/2, y = -d/2, m = Math.min(w,d);
  switch (t){
    case 'bed': {
      let s = rc(x,y,w,d,'#fbf8f2','rx="30"') + rc(x,y,w,Math.min(90,d*.05),shade(c,.62),'rx="20"');
      const ph = Math.min(360,d*.18), py = y+150;
      if (w >= 1300){ const pw = (w-240)/2; s += rc(x+80,py,pw,ph,'#fff','rx="70"') + rc(x+160+pw,py,pw,ph,'#fff','rx="70"'); }
      else s += rc(x+80,py,w-160,ph,'#fff','rx="70"');
      const by = py+ph+110, bh = y+d-15-by;
      s += rc(x+15,by,w-30,bh,c,'rx="40"') + pa(`M${x+15} ${by+300}H${x+w-15}`,'none',DASH);
      s += pa(`M${x+w-15-Math.min(420,w*.3)} ${by}L${x+w-15} ${by}L${x+w-15} ${by+Math.min(420,w*.3)}Z`, shade(c,1.12));
      return s;
    }
    case 'sofa': case 'armchair': {
      const b = d*.24, a = Math.min(200,w*.13), n = t==='armchair' ? 1 : (w>2200 ? 3 : 2), cw = (w-2*a)/n, dk = shade(c,.85);
      let s = rc(x,y,w,d,dk,'rx="60"');
      for (let i=0;i<n;i++) s += rc(x+a+i*cw,y+b,cw,d-b-40,c,'rx="40"');
      return s + rc(x,y,w,b,dk,'rx="50"') + rc(x,y,a,d,dk,'rx="50"') + rc(x+w-a,y,a,d,dk,'rx="50"');
    }
    case 'cornersofa': {
      const k = Math.min(950,d*.56,w*.4), b = 220, dk = shade(c,.85);
      let s = pa(`M${x} ${y}H${x+w}V${y+k}H${x+k}V${y+d}H${x}Z`, dk);
      const cw = (w-b-200)/2;
      s += rc(x+b,y+b,cw,k-b-30,c,'rx="40"') + rc(x+b+cw,y+b,cw,k-b-30,c,'rx="40"') + rc(x+b,y+k,k-b-30,d-k-200,c,'rx="40"');
      return s + rc(x,y,w,b,dk,'rx="50"') + rc(x,y,b,d,dk,'rx="50"') + rc(x+w-200,y,200,k,dk,'rx="50"') + rc(x,y+d-200,k,200,dk,'rx="50"');
    }
    case 'nightstand': return rc(x,y,w,d,c,'rx="30"') + `<circle r="${m*.24}" fill="#fff6dd" ${ST}/>` + `<circle r="${m*.08}" fill="${shade(c,.8)}" ${ST}/>`;
    case 'wardrobe': {
      let s = rc(x,y,w,d,c) + ln(x+50,0,x+w-50,0);
      for (let hx = x+160; hx < x+w-100; hx += 180) s += ln(hx-45,-d*.28,hx+45,d*.28,'opacity=".6"');
      return s;
    }
    case 'cabinet': case 'shoecab': return rc(x,y,w,d,c) + ln(x,y+d,x+w,y);
    case 'dresser': return rc(x,y,w,d,c,'rx="20"') + rc(x+w*.2,y,w*.6,55,'#dfe9ee') + ec(0,d/2+180,160,140,shade(c,.9));
    case 'desk': return rc(x,y,w,d,c,'rx="20"') + rc(-w*.18,y+50,w*.36,45,'#555') + rc(-w*.14,y+d*.45,w*.28,d*.28,'#f4f4f4','rx="10"');
    case 'chair': return rc(x+25,y+d*.16,w-50,d*.84-10,c,'rx="60"') + rc(x,y,w,d*.2,shade(c,.78),'rx="40"');
    case 'bookshelf': { let s = rc(x,y,w,d,c); for (let bx = x+400; bx < x+w-50; bx += 400) s += ln(bx,y,bx,y+d); return s; }
    case 'baycushion': return rc(x,y,w,d,c,'rx="60"') + rc(x+60,y+80,w-120,Math.min(300,d*.2),'#fff','rx="60"') + rc(x+60,y+d-80-Math.min(300,d*.2),w-120,Math.min(300,d*.2),'#fff','rx="60"');
    case 'coffeetable': return rc(x,y,w,d,c,'rx="80"') + rc(x+60,y+60,w-120,d-120,shade(c,1.06),'rx="50"');
    case 'tvstand': return rc(x,y,w,d,c) + rc(x+w*.15,y+30,w*.7,55,'#3a3a3a');
    case 'rug': return rc(x,y,w,d,c,'rx="40" fill-opacity=".6"') + rc(x+90,y+90,w-180,d-180,'none','rx="30" stroke-dasharray="3 3" opacity=".6"');
    case 'plant': {
      let s = `<circle r="${m/2}" fill="${c}" fill-opacity=".85" ${ST}/>`;
      for (let k=0;k<8;k++) s += `<ellipse cx="0" cy="${-m*.27}" rx="${m*.1}" ry="${m*.21}" transform="rotate(${k*45})" fill="${shade(c,.8)}" ${ST}/>`;
      return s + `<circle r="${m*.1}" fill="#8a6a4a" ${ST}/>`;
    }
    case 'table': return rc(x,y,w,d,c,'rx="30"') + rc(x+50,y+50,w-100,d-100,'none','rx="20" opacity=".4"');
    case 'roundtable': return ec(0,0,w/2,d/2,c) + ec(0,0,w/2-50,d/2-50,'none','opacity=".4"');
    case 'counter': return rc(x,y,w,d,c) + ln(x,y+d-40,x+w,y+d-40,DASH);
    case 'stove': {
      let s = rc(x,y,w,d,'#2f2f2f','rx="20"'); const r = m*.26;
      const pts = w/d > 1.4 ? [[-w/4,0],[w/4,0]] : [[-w/4,-d/4],[w/4,-d/4],[-w/4,d/4],[w/4,d/4]];
      pts.forEach(([px,py]) => s += `<circle cx="${px}" cy="${py}" r="${r}" fill="none" stroke="#bbb" stroke-width="1" vector-effect="non-scaling-stroke"/><circle cx="${px}" cy="${py}" r="${r*.45}" fill="#666"/>`);
      return s;
    }
    case 'ksink': return rc(x,y,w,d,c,'rx="20"') + rc(x+w*.06,y+d*.18,w*.42,d*.66,'#fff','rx="50"') + rc(x+w*.52,y+d*.18,w*.42,d*.66,'#fff','rx="50"') + `<circle cx="0" cy="${y+d*.09}" r="22" fill="#999"/>`;
    case 'fridge': return rc(x,y,w,d,c,'rx="30"') + ln(x,y+d*.14,x+w,y+d*.14) + ln(0,y+d*.14,0,y+d) + rc(-70,y+d*.5,40,d*.25,'#aab') + rc(30,y+d*.5,40,d*.25,'#aab');
    case 'toilet': return rc(x+w*.04,y,w*.92,d*.27,c,'rx="30"') + ec(0,y+d*.27+d*.36,w*.47,d*.36,c) + ec(0,y+d*.27+d*.4,w*.3,d*.24,'#eef4f7');
    case 'vanity': return rc(x,y,w,d,c,'rx="20"') + ec(0,y+d*.57,Math.min(w*.32,260),d*.28,'#fff') + `<circle cx="0" cy="${y+d*.17}" r="26" fill="#999"/>`;
    case 'shower': return rc(x,y,w,d,c) + ln(x,y,x+w,y+d,DASH) + ln(x+w,y,x,y+d,DASH) + `<circle r="45" fill="#fff" ${ST}/>`;
    case 'bathtub': return rc(x,y,w,d,c,'rx="40"') + rc(x+80,y+80,w-160,d-160,'#fff',`rx="${m*.33}"`) + `<circle cx="${x+w-260}" cy="0" r="35" fill="#ccc" ${ST}/>`;
    case 'washer': case 'dryer': return rc(x,y,w,d,c,'rx="30"') + rc(x,y,w,d*.14,shade(c,.9)) + `<circle cy="${d*.06}" r="${m*.34}" fill="#fff" ${ST}/><circle cy="${d*.06}" r="${m*.24}" fill="${t==='dryer'?'#e9dccb':'#cfdde4'}" ${ST}/>`;
    case 'crib': {
      let s = rc(x,y,w,d,c,'rx="20"') + rc(x+45,y+45,w-90,d-90,'#fff','rx="20"');
      for (let sx = x+90; sx < x+w-60; sx += 90) s += ln(sx,y,sx,y+45,'opacity=".5"') + ln(sx,y+d-45,sx,y+d,'opacity=".5"');
      return s;
    }
    case 'beanbag': return ec(0,0,w/2,d/2,c) + ec(-w*.04,-d*.06,w*.3,d*.28,shade(c,1.12),'opacity=".9"');
    case 'sidetable': return ec(0,0,w/2,d/2,c) + ec(0,0,w*.12,d*.12,'none','opacity=".5"');
    case 'floorlamp': return `<circle r="${m*.5}" fill="#fff6dd" fill-opacity=".85" ${ST}/>` + `<circle r="${m*.32}" fill="none" ${ST} ${DASH}/>` + `<circle r="${m*.07}" fill="${c}" ${ST}/>`;
    case 'island': return rc(x,y,w,d,c) + ln(x,y+d-250,x+w,y+d-250,DASH);
    case 'barstool': return `<circle r="${m/2}" fill="${c}" ${ST}/><circle r="${m*.3}" fill="${shade(c,1.15)}" ${ST}/>`;
    case 'waterheater': return rc(x,y,w,d,c,`rx="${d/2}" ${DASH}`) + ln(x+w*.2,0,x+w*.8,0,DASH);
    case 'tv': return rc(x,y,w,d,c,'rx="10"') + rc(x+w*.3,y+d,w*.4,Math.min(40,d),'#666');
    case 'aircon': return rc(x,y,w,d,c,'rx="30"') + ln(x+40,y+d*.72,x+w-40,y+d*.72) + ln(x+40,y+d*.86,x+w-40,y+d*.86);
    case 'acwall': {
      let s = rc(x,y,w,d,c,`rx="30" ${DASH}`);
      [.25,.5,.75].forEach(k => s += ln(x+w*k,y+d,x+w*k,y+d+200,`${DASH} opacity=".6"`));
      return s;
    }
    case 'dishwasher': return rc(x,y,w,d,c,'rx="15"') + ln(x,y+d-70,x+w,y+d-70) + rc(x+w*.3,y+d-45,w*.4,25,'#888');
    case 'ovencol': return rc(x,y,w,d,c) + ln(x,y,x+w,y+d) + ln(x+w,y,x,y+d);
    case 'purifier': return rc(x,y,w,d,c,'rx="60"') + rc(x+45,y+45,w-90,d-90,'none',`rx="40" ${DASH}`);
    case 'officechair': {
      let s = '';
      for (let k = 0; k < 5; k++) s += `<line x1="0" y1="0" x2="0" y2="${m*.48}" transform="rotate(${k*72+36})" stroke="#555" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
      return s + rc(x+w*.12,y+d*.22,w*.76,d*.66,c,'rx="80"') + rc(x+w*.15,y+d*.04,w*.7,d*.16,shade(c,.78),'rx="40"')
        + rc(x+w*.02,y+d*.3,w*.1,d*.45,shade(c,.7),'rx="30"') + rc(x+w*.88,y+d*.3,w*.1,d*.45,shade(c,.7),'rx="30"');
    }
    case 'piano': {
      let s = rc(x,y,w,d*.55,c,'rx="10"') + rc(x+40,y+d*.55,w-80,d*.4,shade(c,1.4),'rx="10"');
      const kx = x+90, kw = w-180, kd = d*.2;
      s += rc(kx,y+d*.55,kw,kd,'#faf8f3');
      for (let i = 1; i < 26; i++) s += ln(kx+kw*i/26,y+d*.55,kx+kw*i/26,y+d*.55+kd,'opacity=".5"');
      return s;
    }
    case 'treadmill': return rc(x,y,w,d,c,'rx="50"') + rc(x+90,y+320,w-180,d-400,'#1c1c1e','rx="25"') + rc(x,y,w,230,shade(c,1.4),'rx="40"');
    default: return rc(x,y,w,d,c);
  }
}

/* ======================= 渲染 ======================= */
const NOLABEL = ['plant','floorlamp','sidetable','barstool','beanbag'];
function renderRooms(){
  let s = '';
  ROOMS.forEach(r => {
    const st = state.rooms[r.id] || (state.rooms[r.id] = {name:r.name, mat:r.mat, at:r.at});
    s += `<polygon class="room" data-room="${r.id}" points="${r.poly.map(p=>p.join(',')).join(' ')}" fill="url(#m-${st.mat})"/>`;
  });
  const sill = d => {
    const [x0,y0] = d.a, [x1,y1] = d.b, th = d.wt || 150, L = Math.hypot(x1-x0, y1-y0) || 1;
    const nx = -(y1-y0)/L*th/2, ny = (x1-x0)/L*th/2;
    return `<polygon points="${polyStr([[x0+nx,y0+ny],[x1+nx,y1+ny],[x1-nx,y1-ny],[x0-nx,y0-ny]])}" fill="#e2dacb" stroke="#b9b0a0" stroke-width="1" vector-effect="non-scaling-stroke" pointer-events="none"/>`;
  };
  DOORS.forEach(d => s += sill(d)); SLIDES.forEach(d => s += sill({a:d.rect.slice(0,2), b:[d.rect[2],d.rect[1]], wt:150}));
  $('#gRooms').innerHTML = s;
}

function renderFurn(){
  const g = $('#gFurn');
  g.setAttribute('display', ui.layers.furn ? 'inline' : 'none');
  g.innerHTML = state.furniture.map(f => {
    const fs = Math.max(80, Math.min(170, Math.min(f.w,f.d)*.2));
    const label = Math.min(f.w,f.d) >= 380 && !NOLABEL.includes(f.type)
      ? `<text transform="rotate(${-f.rot})" font-size="${fs}" text-anchor="middle" dominant-baseline="central" fill="#4a443c" opacity=".8" pointer-events="none">${esc(nm(f.name))}</text>` : '';
    return `<g class="furn" data-fid="${f.id}" transform="translate(${f.cx} ${f.cy}) rotate(${f.rot})">${furnSVG(f.type,f.w,f.d,f.color)}${label}</g>`;
  }).join('');
}

function renderLamps(){
  const g = $('#gLamps'); if (!g) return;
  const sel = ui.sel?.kind === 'lamp' ? ui.sel.id : null;
  g.innerHTML = (state.lamps || []).map(l => {
    const on = sel === l.id;
    const A = `stroke="${on ? '#b5653a' : '#c9a227'}" stroke-width="${on ? 2 : 1.2}" vector-effect="non-scaling-stroke"`;
    return `<g class="lamp" data-lamp="${l.id}">
      <circle cx="${l.x}" cy="${l.y}" r="${300}" fill="#fff8e0" ${A}/>
      <g pointer-events="none">
        ${[0, 45, 90, 135].map(a => { const t = a*Math.PI/180, c = Math.cos(t)*300, s = Math.sin(t)*300;
          return `<line x1="${l.x-c}" y1="${l.y-s}" x2="${l.x+c}" y2="${l.y+s}" stroke="#e0c061" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".55"/>`; }).join('')}
        <circle cx="${l.x}" cy="${l.y}" r="${95}" fill="#e8c547" stroke="#b8962f" stroke-width="1" vector-effect="non-scaling-stroke"/>
      </g></g>`;
  }).join('');
}

function renderWalls(){
  $('#gWalls').innerHTML = WALLS.map(w => {
    const dem = state.demolished.includes(w.id), k = w.k;
    let fill = k==='b' ? (ui.layers.bearing ? '#b8412c' : '#26241f') : k==='low' ? '#e9e3d8' : k==='e' ? '#8f897d' : '#a7a195';
    let ex = k==='low' ? 'stroke="#8f897d" stroke-width="1" vector-effect="non-scaling-stroke"' : '';
    if (dem){ fill = 'rgba(198,91,58,.12)'; ex = 'stroke="#c65b3a" stroke-width="1.2" stroke-dasharray="5 3" vector-effect="non-scaling-stroke"'; }
    if (!dem && ui.sel?.kind === 'wall' && ui.sel.id === w.id) ex = 'stroke="#b5653a" stroke-width="2" vector-effect="non-scaling-stroke"';
    return `<polygon class="wall" data-wall="${w.id}" points="${polyStr(wallQuad(w))}" fill="${fill}" ${ex}/>`;
  }).join('');
}

function renderOpenings(){
  const WS = 'stroke="#4f7394" stroke-width="1" vector-effect="non-scaling-stroke"';
  let s = '';
  WINS.forEach(w => {
    const [x0,y0,x1,y1] = [w.x0,w.y0,w.x1,w.y1], th = wallTh(w), L = Math.hypot(x1-x0, y1-y0) || 1;
    const nx = -(y1-y0)/L*th/2, ny = (x1-x0)/L*th/2;
    const sel = ui.sel?.kind==='open' && ui.sel.sub==='win' && ui.sel.id===w.id;
    s += `<polygon class="open" data-open="win" data-oid="${w.id}" points="${polyStr([[x0+nx,y0+ny],[x1+nx,y1+ny],[x1-nx,y1-ny],[x0-nx,y0-ny]])}" fill="#f7fbfd" ${WS}${sel?' stroke="#b5653a" stroke-width="2"':''}/>`;
    [1/3,2/3].forEach(t => { const ax = x0+(x1-x0)*t, ay = y0+(y1-y0)*t; s += `<line x1="${ax-nx}" y1="${ay-ny}" x2="${ax+nx}" y2="${ay+ny}" ${WS} pointer-events="none"/>`; });
  });
  const DS = 'stroke="#3d3a34" stroke-width="1" vector-effect="non-scaling-stroke"';
  DOORS.forEach(d => {
    const [hx,hy] = d.h, L = d.len, T = 40;
    const ox = hx + d.o[0]*L, oy = hy + d.o[1]*L, cx = hx + d.c[0]*L, cy = hy + d.c[1]*L;
    const sweep = d.o[0]*d.c[1] - d.o[1]*d.c[0] > 0 ? 1 : 0;
    const col = d.entry ? '#b5653a' : '#3d3a34';
    const sel = ui.sel?.kind==='open' && ui.sel.sub==='door' && ui.sel.id===d.id;
    s += `<g class="open" data-open="door" data-oid="${d.id}"><polygon points="${hx},${hy} ${ox},${oy} ${ox+d.c[0]*T},${oy+d.c[1]*T} ${hx+d.c[0]*T},${hy+d.c[1]*T}" fill="#fff" stroke="${sel?'#b5653a':col}" stroke-width="${d.entry||sel?1.8:1}" vector-effect="non-scaling-stroke"/>`;
    s += `<path d="M${ox} ${oy}A${L} ${L} 0 0 ${sweep} ${cx} ${cy}" fill="none" ${DS} stroke-dasharray="5 3" opacity=".7"/></g>`;
  });
  SLIDES.forEach(({rect:[x0,y0,x1,y1],v}) => {
    if (v){ const L = y1-y0, m = (x0+x1)/2; s += `<rect x="${m-45}" y="${y0}" width="40" height="${L*.55}" fill="#fff" ${DS}/><rect x="${m+5}" y="${y1-L*.55}" width="40" height="${L*.55}" fill="#fff" ${DS}/>`; }
    else { const L = x1-x0, m = (y0+y1)/2; s += `<rect x="${x0}" y="${m-45}" width="${L*.55}" height="40" fill="#fff" ${DS}/><rect x="${x1-L*.55}" y="${m+5}" width="${L*.55}" height="40" fill="#fff" ${DS}/>`; }
  });
  // 入户标识（при наличии входной двери）
  const entry = DOORS.find(d => d.entry);
  if (entry){
    const m = [(entry.a[0]+entry.b[0])/2, (entry.a[1]+entry.b[1])/2];
    const hx0 = m[0] + entry.o[0]*1000, hy0 = m[1] + entry.o[1]*1000;
    const hx1 = m[0] + entry.o[0]*300, hy1 = m[1] + entry.o[1]*300;
    const px = -entry.o[1]*160, py = entry.o[0]*160;
    s += `<path d="M${hx0} ${hy0}L${hx1} ${hy1}M${hx1} ${hy1}L${hx1+px+entry.o[0]*140} ${hy1+py+entry.o[1]*140}M${hx1} ${hy1}L${hx1-px+entry.o[0]*140} ${hy1-py+entry.o[1]*140}" fill="none" stroke="#b5653a" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <text x="${m[0]+entry.o[0]*1450}" y="${m[1]+entry.o[1]*1450}" font-size="200" text-anchor="middle" fill="#b5653a">${tr('入户','Entry','Вход')}</text>`;
  }
  $('#gOpen').innerHTML = s;
}

function renderLabels(){
  const g = $('#gLabels');
  g.setAttribute('display', ui.layers.labels ? 'inline' : 'none');
  g.innerHTML = ROOMS.filter(r => r.at).map(r => {

      <text x="${x}" y="${y+260}" font-size="175" text-anchor="middle" fill="#7d7366" ${halo}>${fmt(rArea(r))} m²</text>`;

function renderDims(){
  const DC = '#7d7160', LS = `stroke="${DC}" stroke-width="1" vector-effect="non-scaling-stroke"`, TK = `stroke="${DC}" stroke-width="2" vector-effect="non-scaling-stroke"`;
  const txt = (x,y,v,rot) => `<text x="${x}" y="${y}" font-size="${v<400?140:200}" text-anchor="middle" fill="${DC}" ${rot?`transform="rotate(-90 ${x} ${y})"`:''}>${fmtN(v)}</text>`;
  const chain = (horiz, at, start, segs) => {
    const pts = [start]; segs.forEach(v => pts.push(pts[pts.length-1]+v));
    let s = horiz ? `<line x1="${pts[0]}" y1="${at}" x2="${pts.at(-1)}" y2="${at}" ${LS}/>` : `<line x1="${at}" y1="${pts[0]}" x2="${at}" y2="${pts.at(-1)}" ${LS}/>`;
    pts.forEach(p => s += horiz
      ? `<line x1="${p}" y1="${at-170}" x2="${p}" y2="${at+170}" ${LS}/><line x1="${p-80}" y1="${at+80}" x2="${p+80}" y2="${at-80}" ${TK}/>`
      : `<line x1="${at-170}" y1="${p}" x2="${at+170}" y2="${p}" ${LS}/><line x1="${at-80}" y1="${p+80}" x2="${at+80}" y2="${p-80}" ${TK}/>`);
    segs.forEach((v,i) => { const mid = (pts[i]+pts[i+1])/2; s += horiz ? txt(mid, at-70, v) : txt(at-70, mid, v, true); });
    return s;
  };
  const g = $('#gDims');
  // 动态外轮廓尺寸（bbox 链，随墙体编辑更新）
  const pts = [];
  WALLS.filter(w => !state.demolished.includes(w.id)).concat(WINS).forEach(w => {
    const th = wallTh(w), L = Math.hypot(w.x1-w.x0, w.y1-w.y0) || 1;
    const nx = -(w.y1-w.y0)/L*th/2, ny = (w.x1-w.x0)/L*th/2;
    pts.push([w.x0,w.y0],[w.x1,w.y1],[w.x0+nx,w.y0+ny],[w.x1+nx,w.y1+ny],[w.x0-nx,w.y0-ny],[w.x1-nx,w.y1-ny]);
  });
  if (pts.length){
    const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
    const X0 = Math.min(...xs), X1 = Math.max(...xs), Y0 = Math.min(...ys), Y1 = Math.max(...ys);
    g.innerHTML =
      chain(true, Y0-750, X0, [Math.round(X1-X0)]) + chain(true, Y1+750, X0, [Math.round(X1-X0)]) +
      chain(false, X0-800, Y0, [Math.round(Y1-Y0)]) + chain(false, X1+800, Y0, [Math.round(Y1-Y0)]);
  } else g.innerHTML = '';
  g.setAttribute('display', ui.layers.dims ? 'inline' : 'none');
}

function renderGrid(){
  $('#gGrid').innerHTML = `<rect x="-20000" y="-20000" width="55000" height="55000" fill="${ui.layers.grid ? 'url(#grid)' : 'transparent'}" data-bg="1"/>`;
}

function renderMeasure(){
  const k = 1/view.s, fs = 12*k;
  const one = (a,b,tmp) => {
    const L = Math.hypot(b.x-a.x, b.y-a.y); if (L < 1) return '';
    let ang = Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI; if (ang > 90 || ang < -90) ang += 180;
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2, nx = -(b.y-a.y)/L*5*k, ny = (b.x-a.x)/L*5*k;
    const col = tmp ? '#2f5d62' : '#b5653a', S = `stroke="${col}" stroke-width="1.5" vector-effect="non-scaling-stroke"`;
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" ${S}/>
      <line x1="${a.x-nx}" y1="${a.y-ny}" x2="${a.x+nx}" y2="${a.y+ny}" ${S}/><line x1="${b.x-nx}" y1="${b.y-ny}" x2="${b.x+nx}" y2="${b.y+ny}" ${S}/>
      <text x="${mx}" y="${my-5*k}" font-size="${fs}" text-anchor="middle" fill="${col}" font-weight="600" transform="rotate(${ang} ${mx} ${my})"
        stroke="#fff" stroke-width="${3.5*k}" paint-order="stroke">${fmtL(L)}</text>`;
  };
  let s = state.measures.map(m => one(m.a,m.b)).join('');
  if (ui.mA && ui.mCur) s += one(ui.mA, ui.mCur, true);
  if (ui.mA) s += `<circle cx="${ui.mA.x}" cy="${ui.mA.y}" r="${3*k}" fill="#2f5d62"/>`;
  $('#gMeasure').innerHTML = s;
}

function renderSel(){
  const k = 1/view.s; let s = '';
  if (ui.sel?.kind === 'furn'){
    const f = getF(ui.sel.id);
    if (f){
      // 触屏上手柄更大、离家具更远，并各带一圈透明的大热区
      const p = 5*k, A = 'stroke="#b5653a" vector-effect="non-scaling-stroke"', hs = COARSE ? 1.7 : 1, ro = (COARSE ? 40 : 26)*k, hit = (COARSE ? 24 : 11)*k;
      const sx = f.w/2+p, sy = f.d/2+p;
      s += `<g transform="translate(${f.cx} ${f.cy}) rotate(${f.rot})">
        <rect x="${-f.w/2-p}" y="${-f.d/2-p}" width="${f.w+2*p}" height="${f.d+2*p}" fill="none" ${A} stroke-width="1.5" stroke-dasharray="5 3" pointer-events="none"/>
        <line x1="0" y1="${-f.d/2-p}" x2="0" y2="${-f.d/2-ro}" ${A} stroke-width="1" pointer-events="none"/>
        <circle data-handle="rot" cx="0" cy="${-f.d/2-ro}" r="${hit}" fill="transparent"/>
        <circle data-handle="rot" cx="0" cy="${-f.d/2-ro}" r="${6*hs*k}" fill="#fff" ${A} stroke-width="1.5"><title>${tr('拖动旋转（Shift 自由角度）','Drag to rotate (Shift for free angle)', 'Перетаскивание — поворот (Shift — свободный угол)')}</title></circle>
        <circle data-handle="size" cx="${sx}" cy="${sy}" r="${hit}" fill="transparent"/>
        <rect data-handle="size" x="${sx-5*hs*k}" y="${sy-5*hs*k}" width="${10*hs*k}" height="${10*hs*k}" fill="#b5653a"><title>${tr('拖动调整尺寸','Drag to resize', 'Перетащите, чтобы изменить размер')}</title></rect></g>`;
      const {hh} = aabb(f);
      s += `<text x="${f.cx}" y="${f.cy+hh+24*k}" font-size="${12*k}" text-anchor="middle" fill="#b5653a" font-weight="600" pointer-events="none"
        stroke="#fff" stroke-width="${3*k}" paint-order="stroke">${fmtN(f.w)} × ${fmtN(f.d)} ${US()}</text>`;
    }
  } else if (ui.sel?.kind === 'lamp'){
    const l = getLamp(ui.sel.id);
    if (l){
      s += `<circle cx="${l.x}" cy="${l.y}" r="${360}" fill="none" stroke="#b5653a" vector-effect="non-scaling-stroke" stroke-width="1.5" stroke-dasharray="6 4" pointer-events="none"/>`;
      s += `<text x="${l.x}" y="${l.y+520}" font-size="${13*k}" text-anchor="middle" fill="#b5653a" font-weight="600" pointer-events="none"
        stroke="#fff" stroke-width="${3*k}" paint-order="stroke">${tr('吸顶灯','Ceiling light','Светильник')}</text>`;
    }
  } else if (ui.sel?.kind === 'room'){
    const r = ROOMS.find(r => r.id === ui.sel.id);
    if (r) s += `<polygon points="${r.poly.map(p=>p.join(',')).join(' ')}" fill="rgba(181,101,58,.08)" stroke="#b5653a" stroke-width="2" vector-effect="non-scaling-stroke" pointer-events="none"/>`;
  } else if (ui.sel?.kind === 'wall'){
    const w = getWall(ui.sel.id);
    if (w){
      const A = 'stroke="#b5653a" vector-effect="non-scaling-stroke"', ro = (COARSE ? 40 : 26)*k, hit = (COARSE ? 24 : 11)*k;
      s += `<line x1="${w.x0}" y1="${w.y0}" x2="${w.x1}" y2="${w.y1}" ${A} stroke-width="1.5" stroke-dasharray="6 4" pointer-events="none"/>`;
      [['wa',w.x0,w.y0],['wb',w.x1,w.y1]].forEach(([h,x,y]) => {
        s += `<circle data-handle="${h}" cx="${x}" cy="${y}" r="${hit}" fill="transparent"/>
              <circle data-handle="${h}" cx="${x}" cy="${y}" r="${7*k}" fill="#fff" ${A} stroke-width="1.5"/>`;
      });
      const L = Math.round(segLen(w)), mx = (w.x0+w.x1)/2, my = (w.y0+w.y1)/2;
      s += `<text x="${mx}" y="${my-14*k}" font-size="${12*k}" text-anchor="middle" fill="#b5653a" font-weight="600" pointer-events="none"
        stroke="#fff" stroke-width="${3*k}" paint-order="stroke">${fmtL(L)}</text>`;
    }
  } else if (ui.sel?.kind === 'line'){
    const l = (state.lines || []).find(x => x.id === ui.sel.id);
    if (l){
      const A = 'stroke="#b5653a" vector-effect="non-scaling-stroke"', ro = (COARSE ? 40 : 26)*k, hit = (COARSE ? 24 : 11)*k;
      s += `<line x1="${l.x0}" y1="${l.y0}" x2="${l.x1}" y2="${l.y1}" ${A} stroke-width="1.5" stroke-dasharray="6 4" pointer-events="none"/>`;
      [['wa',l.x0,l.y0],['wb',l.x1,l.y1]].forEach(([hh,x,y]) => {
        s += `<circle data-handle="${hh}" cx="${x}" cy="${y}" r="${hit}" fill="transparent"/>
              <circle data-handle="${hh}" cx="${x}" cy="${y}" r="${7*k}" fill="#fff" ${A} stroke-width="1.5"/>`;
      });
      const L = Math.round(Math.hypot(l.x1-l.x0, l.y1-l.y0)), mx = (l.x0+l.x1)/2, my = (l.y0+l.y1)/2;
      s += `<text x="${mx}" y="${my-14*k}" font-size="${12*k}" text-anchor="middle" fill="#b5653a" font-weight="600" pointer-events="none"
        stroke="#fff" stroke-width="${3*k}" paint-order="stroke">${fmtL(L)}</text>`;
    }
  } else if (ui.sel?.kind === 'bg' && state.bg){
    const b = state.bg, p = 4/view.s;
    s += `<rect x="${b.x-p}" y="${b.y-p}" width="${b.w+2*p}" height="${b.h+2*p}" fill="none" stroke="#b5653a" vector-effect="non-scaling-stroke" stroke-width="1.5" stroke-dasharray="6 4" pointer-events="none"/>`;
  } else if (ui.sel?.kind === 'multi'){
    const A = 'stroke="#b5653a" vector-effect="non-scaling-stroke" fill="none" pointer-events="none"';
    (ui.sel.items || []).forEach(it => {
      if (it.kind === 'wall'){
        const w = getWall(it.id);
        if (w) s += `<line x1="${w.x0}" y1="${w.y0}" x2="${w.x1}" y2="${w.y1}" ${A} stroke-width="2" stroke-dasharray="6 4"/>`;
      } else if (it.kind === 'furn'){
        const f = getF(it.id);
        if (f){ const {hw, hh} = aabb(f); s += `<rect x="${f.cx-hw}" y="${f.cy-hh}" width="${hw*2}" height="${hh*2}" ${A} stroke-width="1.5" stroke-dasharray="5 3"/>`; }
      } else if (it.kind === 'open'){
        const o = it.sub === 'door' ? DOORS.find(d => d.id === it.id) : WINS.find(w => w.id === it.id);
        if (o){
          const mx = it.sub === 'door' ? (o.a[0]+o.b[0])/2 : (o.x0+o.x1)/2, my = it.sub === 'door' ? (o.a[1]+o.b[1])/2 : (o.y0+o.y1)/2;
          s += `<circle cx="${mx}" cy="${my}" r="${6/view.s}" ${A} stroke-width="1.5"/>`;
        }
      } else if (it.kind === 'line'){
        const l = (state.lines || []).find(x => x.id === it.id);
        if (l) s += `<line x1="${l.x0}" y1="${l.y0}" x2="${l.x1}" y2="${l.y1}" ${A} stroke-width="2" stroke-dasharray="6 4"/>`;
      } else if (it.kind === 'lamp'){
        const lp = getLamp(it.id);
        if (lp) s += `<circle cx="${lp.x}" cy="${lp.y}" r="${360}" ${A} stroke-width="1.5"/>`;
      }
    });
  }
  $('#gSel').innerHTML = s;
}

function renderBg(){
  const g = $('#gBg'); if (!g) return;
  const b = state.bg;
  if (!b || ui.layers.bg === false){ g.innerHTML = ''; g.classList.remove('sel'); return; }
  g.classList.toggle('sel', ui.sel?.kind === 'bg');
  g.innerHTML = `<image data-bg="1" href="${b.src}" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" opacity="${b.op ?? .65}" preserveAspectRatio="none" style="cursor:${b.lock ? 'default' : 'move'}"/>`;
}

      <line x1="${l.x0}" y1="${l.y0}" x2="${l.x1}" y2="${l.y1}" stroke="transparent" stroke-width="10" vector-effect="non-scaling-stroke" pointer-events="stroke"/></g>`;

function renderAll(){
  rebindData(); rebuildRooms();
  renderGrid(); renderRooms(); renderBg(); renderFurn(); renderLamps(); renderWalls(); renderOpenings(); renderLines(); renderLabels();
  renderDims(); renderMeasure(); renderSel(); renderPanel(); updateHeader(); renderDrawPreview();

function updateHeader(){
  const tot = ROOMS.filter(r => r.counted !== false).reduce((a,r) => a + rArea(r), 0);
  $('#subtitle').textContent = tr(`套内使用面积约 ${fmt(tot)} m² · 尺寸单位 ${US()} · 原图比例 1:60`, `Net floor area ≈ ${fmt(tot)} m² · Units: ${US()} · Original scale 1:60`, `С/у ≈ ${fmt(tot)} м² · ед. изм. ${US()} · 1:60`);
  $('#undo').disabled = !undoStack.length; $('#redo').disabled = !redoStack.length;
  $('#undo').style.opacity = undoStack.length ? 1 : .4; $('#redo').style.opacity = redoStack.length ? 1 : .4;
}

/* ======================= 右侧面板 ======================= */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderPanel(){
  renderFab();
  const p = $('#panel');
  if (ui.sel?.kind === 'furn'){ const f = getF(ui.sel.id); if (f){ p.innerHTML = furnPanel(f); bindFurnPanel(f); return; } }
  if (ui.sel?.kind === 'lamp'){ const l = getLamp(ui.sel.id); if (l){ p.innerHTML = lampPanel(l); bindLampPanel(l); return; } }
  if (ui.sel?.kind === 'room'){ p.innerHTML = roomPanel(ROOMS.find(r => r.id === ui.sel.id)); bindRoomPanel(); return; }
  if (ui.sel?.kind === 'wall'){ const w = getWall(ui.sel.id); if (w){ p.innerHTML = wallPanel(w); bindWallPanel(w); return; } }
  if (ui.sel?.kind === 'line'){ const l = (state.lines || []).find(x => x.id === ui.sel.id); if (l){ p.innerHTML = linePanel(l); bindLinePanel(); return; } }
  if (ui.sel?.kind === 'open'){
    const o = ui.sel.sub === 'door' ? DOORS.find(d => d.id === ui.sel.id) : WINS.find(w => w.id === ui.sel.id);
    if (o){ p.innerHTML = openPanel(ui.sel.sub, o); bindOpenPanel(ui.sel.sub, o); return; }
  }
  if (ui.sel?.kind === 'bg'){
    if (state.bg){ p.innerHTML = bgPanel(); bindBgPanel(); return; }
    ui.sel = null;
  }
  if (ui.sel?.kind === 'multi'){
    if ((ui.sel.items || []).length){ p.innerHTML = multiPanel(); bindMultiPanel(); return; }
    ui.sel = null;
  }
  p.innerHTML = overviewPanel(); bindOverview();
}

function wallPanel(w){
  const kinds = [['b', tr('承重墙','Bearing wall','Несущая')], ['n', tr('隔墙','Partition','Перегородка')], ['low', tr('矮墙','Low wall','Низкая')]];
  const dem = state.demolished.includes(w.id);
  const typeBtns = kinds.map(([k, label]) => `<button class="btn chip${w.k===k?' on':''}" data-wp="${k}"${w.k===k?' disabled':''}>${label} ${WTH[k]}</button>`).join('');
  return `<section><h3>${tr('墙体','Wall','Стена')}</h3>
    <div class="stats"><div><small>${tr('长度','Length', 'Длина')}</small><span class="big">${fmtN(segLen(w))}</span> ${US()}</div>
      <div><small>${tr('类型','Type', 'Тип')}</small><span class="big" style="font-size:14px">${esc(kinds.find(k=>k[0]===w.k)?.[1] || w.k)}</span></div></div>
    <div class="muted" style="margin-top:8px">${tr('拖动两端圆点改长度 / 转角；Delete 删除。','Drag the end dots to reshape; Delete removes it.','Тяните концы для изменения длины; Delete — удалить.')}</div>
    <div class="actions" id="wTypes" style="margin-top:8px">${typeBtns}</div>
    <div class="form"><label>${tr('长度','Length','Длина')} (mm)<input type="number" id="wLen" value="${Math.round(segLen(w))}" min="50" max="50000" step="10"></label>
      <label>${tr('厚度','Thickness','Толщина')} (mm)<input type="number" id="wTh" value="${Math.round(wallTh(w))}" min="50" max="600" step="10"></label></div>
    <div class="actions">
      <button class="btn" id="wDemo">${dem ? tr('恢复墙体','Restore','Восстановить') : tr('标记拆除','Mark for removal','Под снос')}</button>
      <button class="btn danger" id="wDel">${tr('删除','Delete','Удалить')}</button>
      <button class="btn" id="back">${tr('← 返回','← Back','← Назад')}</button>
    </div></section>`;
}
function bindWallPanel(w){
  document.querySelectorAll('#wTypes [data-wp]').forEach(b => b.onclick = () => mutate(() => {
    const ww = getWall(w.id); if (ww){ ww.k = b.dataset.wp; ww.th = WTH[ww.k] || 150; }
  }));
  $('#wLen').onchange = e => mutate(() => {
    const ww = getWall(w.id); if (!ww) return;
    const L = Math.max(50, Math.min(50000, Math.round(parseFloat(e.target.value) || segLen(ww))));
    const old = segLen(ww); if (old < 1) return;
    const ux = (ww.x1-ww.x0)/old, uy = (ww.y1-ww.y0)/old;         // тянем конец b вдоль оси
    ww.x1 = Math.round(ww.x0 + ux*L); ww.y1 = Math.round(ww.y0 + uy*L);
  });
  $('#wTh').onchange = e => mutate(() => {
    const ww = getWall(w.id); if (ww) ww.th = Math.max(50, Math.min(600, Math.round(parseFloat(e.target.value) || wallTh(ww))));
  });
  $('#wDemo').onclick = () => toggleWall(w.id);
  $('#wDel').onclick = deleteSel;
  $('#back').onclick = () => select(null);
}

function lampPanel(l){
  const room = ROOMS.find(r => pointInPoly([l.x, l.y], r.poly));
  return `<section><h3>${tr('吸顶灯','Ceiling light','Светильник')}</h3>
    <div class="stats"><div><small>${tr('位置','Position','Позиция')}</small><span class="big" style="font-size:14px">${room ? esc(nm(state.rooms[room.id].name)) : tr('вне комнаты','outside','вне комнаты')}</span></div></div>
    <div class="form"><label>X (mm)<input type="number" id="lX" value="${Math.round(l.x)}" step="10"></label>
      <label>Y (mm)<input type="number" id="lY" value="${Math.round(l.y)}" step="10"></label></div>
    <div class="muted" style="margin-top:8px">${tr('在平面图上拖动灯即可移动（3D 中吊在天花板的同一位置）。','Drag the light on the plan to move it (it hangs at the same spot on the ceiling in 3D).','Тяните лампу по плану — в3D она висит на потолке в той же точке.')}</div>
    <div class="actions" style="margin-top:8px">
      <button class="btn" id="lCenter" ${room ? '' : 'disabled title="'+tr('Лампа вне комнаты','Light is outside any room','Лампа вне комнаты')+'"'}>${tr('到房间中心','To room centre','В центр комнаты')}</button>
      <button class="btn danger" id="lDel">${tr('删除','Delete','Удалить')}</button>
      <button class="btn" id="back">${tr('← 返回','← Back','← Назад')}</button>
    </div></section>`;
}
function bindLampPanel(l){
  const setPos = (nx, ny) => mutate(() => { const ll = getLamp(l.id); if (ll){ ll.x = nx; ll.y = ny; } });
  $('#lX').onchange = e => setPos(Math.round(parseFloat(e.target.value) || l.x), l.y);
  $('#lY').onchange = e => setPos(l.x, Math.round(parseFloat(e.target.value) || l.y));
  if ($('#lCenter')) $('#lCenter').onclick = () => {
    const r = ROOMS.find(r => pointInPoly([l.x, l.y], r.poly));
    if (r) setPos(Math.round(r.at ? r.at[0] : centroid(r.poly)[0]), Math.round(r.at ? r.at[1] : centroid(r.poly)[1]));
  };
  $('#lDel').onclick = deleteSel;
  $('#back').onclick = () => select(null);
}

function linePanel(l){
  const L = Math.round(Math.hypot(l.x1-l.x0, l.y1-l.y0));
  return `<section><h3>${tr('辅助线','Guide line','Направляющая линия')}</h3>
    <div class="stats"><div><small>${tr('长度','Length','Длина')}</small><span class="big">${fmtN(L)}</span> ${US()}</div></div>
    <div class="muted" style="margin-top:8px">${tr('虚线用于划分与计算：房间检测会把它当作无厚度的分界（端点吸到墙上时房间会分开）。拖动两端圆点改位置。','A dashed helper line used to split / measure: room detection treats it as a zero-thickness boundary (when its ends snap onto walls the rooms separate). Drag the end dots to reshape.','Пунктир — для разметки и расчёта: комнаты разделяются по линии, если концы привязаны к стенам. Тяните концы для изменения.')}</div>
    <div class="actions">
      <button class="btn danger" id="oDel">${tr('删除','Delete','Удалить')}</button>
      <button class="btn" id="back">${tr('← 返回','← Back','← Назад')}</button>
    </div></section>`;
}
function bindLinePanel(){
  $('#oDel').onclick = deleteSel;
  $('#back').onclick = () => select(null);
}

function openPanel(sub, o){
  const isDoor = sub === 'door';
  const title = isDoor ? tr('门','Door','Дверь') : tr('窗','Window','Окно');
  let body = `<div class="stats"><div><small>${tr('宽度','Width', 'Ширина')}</small><span class="big">${fmtN(isDoor ? o.len : Math.hypot(o.x1-o.x0, o.y1-o.y0))}</span> ${US()}</div></div>`;
  if (isDoor){
    body += `<div class="form"><label class="full">${tr('名称','Name', 'Название')}<input id="oName" value="${esc(o.name || '')}"></label></div>`;
    // петли и сторона открывания — считаем от h/c/o
    const L2 = Math.hypot(o.b[0]-o.a[0], o.b[1]-o.a[1]) || 1;
    const nx = -(o.b[1]-o.a[1])/L2, ny = (o.b[0]-o.a[0])/L2;       // нормаль к проёму
    const hl = o.h[0] <= o.h[0] + o.c[0]*o.len;                   // петля слева (по оси x)?
    const midX = (o.a[0]+o.b[0])/2, midY = (o.a[1]+o.b[1])/2;
    const roomAt = (x, y) => ROOMS.find(r => pointInPoly([x, y], r.poly));
    const rP = roomAt(midX + nx*400, midY + ny*400), rM = roomAt(midX - nx*400, midY - ny*400);
    const sideP = o.o[0]*nx + o.o[1]*ny > 0;                      // створка в сторону +нормали?
    const sideLbl = r => r ? esc(nm(state.rooms[r.id].name)) : tr('наружу','outside','наружу');
    body += `<div class="form"><label class="full">${tr('Петли','Hinges','Петли')}
        <div class="actions" style="margin-top:4px">
          <button class="btn chip${hl?' on':''}" data-dh="0" title="${tr('Петли у левого края проёма (на плане)','Hinges at the left end of the opening (plan)','Петли у левого края проёма (на плане)')}">${tr('◀ слева','◀ left','◀ слева')}</button>
          <button class="btn chip${hl?'':' on'}" data-dh="1" title="${tr('Петли у правого края проёма (на плане)','Hinges at the right end of the opening (plan)','Петли у правого края проёма (на плане)')}">${tr('справа ▶','right ▶','справа ▶')}</button>
        </div></label>
      <label class="full">${tr('Открывается в','Opens toward','Открывается в')}
        <div class="actions" style="margin-top:4px">
          <button class="btn chip${sideP?' on':''}" data-ds="1" title="${tr('Створка распахивается в сторону +нормали проёма','Leaf swings toward the opening normal +','Створка распахивается в сторону +нормали проёма')}">${sideLbl(rP)}</button>
          <button class="btn chip${sideP?'':' on'}" data-ds="0" title="${tr('Створка распахивается в другую сторону','Leaf swings the other way','Створка распахивается в другую сторону')}">${sideLbl(rM)}</button>
        </div></label></div>`;
    body += `<label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="oEntry" ${o.entry?'checked':''}> ${tr('入户口（橙色门扇）','Entry door (orange leaf)','Входная дверь (ораневая створка)')}</label>`;
  } else {
    body += `<div class="form"><label>${tr('窗台高','Sill height','Высота подоконника')} (m)<input type="number" id="oSill" value="${(o.sill ?? .9).toFixed(1)}" min="0" max="2.2" step="0.1"></label></div>`;
  }
  return `<section><h3>${title}</h3>${body}
    <div class="muted" style="margin-top:8px">${tr('Delete 删除洞口；墙体会在房间检测中自动闭合。','Delete removes the opening; rooms re-close automatically.','Delete удаляет проём; комнаты пересчитываются.')}</div>
    <div class="actions"><button class="btn danger" id="oDel">${tr('删除','Delete','Удалить')}</button>
      <button class="btn" id="back">${tr('← 返回','← Back','← Назад')}</button></div></section>`;
}
function bindOpenPanel(sub, o){
  if ($('#oName')) $('#oName').onchange = e => mutate(() => { const d = DOORS.find(x => x.id === o.id); if (d) d.name = e.target.value.trim() || d.name; });
  if ($('#oEntry')) $('#oEntry').onchange = e => mutate(() => { const d = DOORS.find(x => x.id === o.id); if (d) d.entry = e.target.checked; });
  if (sub === 'door'){
    // Петли: зеркально переносим на другой конец проёма (h ↔ h+c·len, c → −c, сторона та же)
    document.querySelectorAll('#panel [data-dh]').forEach(b => b.onclick = () => mutate(() => {
      const d = DOORS.find(x => x.id === o.id); if (!d) return;
      const hl = d.h[0] <= d.h[0] + d.c[0]*d.len;
      if (hl === (b.dataset.dh === '0')) return;                  // уже так
      d.h = [Math.round(d.h[0] + d.c[0]*d.len), Math.round(d.h[1] + d.c[1]*d.len)];
      d.c = [-d.c[0], -d.c[1]];
    }));
    // Сторона открывания: o → −o (другая сторона стены, петли на месте)
    document.querySelectorAll('#panel [data-ds]').forEach(b => b.onclick = () => mutate(() => {
      const d = DOORS.find(x => x.id === o.id); if (!d) return;
      const L2 = Math.hypot(d.b[0]-d.a[0], d.b[1]-d.a[1]) || 1;
      const nx = -(d.b[1]-d.a[1])/L2, ny = (d.b[0]-d.a[0])/L2;
      const sideP = d.o[0]*nx + d.o[1]*ny > 0;
      if (sideP === (b.dataset.ds === '1')) return;
      d.o = [-d.o[0], -d.o[1]];
    }));
  }
  if ($('#oSill')) $('#oSill').onchange = e => mutate(() => { const w = WINS.find(x => x.id === o.id); if (w) w.sill = Math.max(0, Math.min(2.2, parseFloat(e.target.value) || .9)); });
  $('#oDel').onclick = deleteSel;
  $('#back').onclick = () => select(null);
}

function bgPanel(){
  const b = state.bg;

/* 侧栏开合：which = 'lib' | 'panel' | null，open 不传则切换。
 * 宽屏：侧栏在布局中收起 / 展开（记住选择）；窄屏：侧栏是浮层抽屉，一次只开一个，which = null 表示全部关闭 */
const PANES = 'huxing-panes';
const panes = (() => { try { return JSON.parse(localStorage.getItem(PANES)) || {}; } catch(e) { return {}; } })();
function drawer(which, open){
  const app = $('.app'), els = {lib:$('aside.lib'), panel:$('aside.right')}, n = narrow();
  if (n){
    Object.entries(els).forEach(([k, el]) => el.classList.toggle('open', k === which && (open ?? !el.classList.contains('open'))));
  } else {
    Object.values(els).forEach(el => el.classList.remove('open'));
    if (which){
      const k = which === 'lib' ? 'hideLib' : 'hidePanel';
      panes[k] = open === undefined ? !panes[k] : !open;
      try { localStorage.setItem(PANES, JSON.stringify(panes)); } catch(e) {}
    }
  }
  app.classList.toggle('hide-lib', !!panes.hideLib); app.classList.toggle('hide-panel', !!panes.hidePanel);
  syncPaneBtns();
}
function syncPaneBtns(){
  const els = {lib:$('aside.lib'), panel:$('aside.right')}, n = narrow();
  const vis = k => n ? els[k].classList.contains('open') : !panes[k === 'lib' ? 'hideLib' : 'hidePanel'];
  $('#tgLib').classList.toggle('on', vis('lib')); $('#tgPanel').classList.toggle('on', vis('panel'));
  $('#tgLib').title = vis('lib') ? tr('收起家具库 ( [ )', 'Hide library ( [ )', 'Скрыть мебель ( [ )') : tr('展开家具库 ( [ )', 'Show library ( [ )', 'Показать мебель ( [ )');
  $('#tgPanel').title = vis('panel') ? tr('收起属性面板 ( ] )', 'Hide properties ( ] )', 'Скрыть свойства ( ] )') : tr('展开属性面板 ( ] )', 'Show properties ( ] )', 'Показать свойства ( ] )');
  $('#stage').classList.toggle('drawer-panel', n && vis('panel'));   // 属性抽屉盖住画面时让出底部工具条
}
